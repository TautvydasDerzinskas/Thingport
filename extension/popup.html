<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Thingport Grab</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #00b800;
        --text: #1f1f1f;
        --text-muted: #6b6b6b;
        --border: #e2e2e2;
        --bg: #ffffff;
        --danger: #d32f2f;
      }
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .header > img { width: 32px; height: 32px; flex-shrink: 0; }
      .header-text { min-width: 0; flex: 1; }
      .header h1 {
        font-size: 15px;
        font-weight: 700;
        margin: 0;
        line-height: 1.2;
      }
      .instance-row {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }
      .instance-url {
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .icon-btn {
        margin: 0;
        width: 22px;
        height: 22px;
        padding: 3px;
        flex-shrink: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--text-muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .icon-btn:hover { background: rgba(0, 0, 0, 0.06); color: var(--text); }
      .icon-btn svg { width: 14px; height: 14px; }
      .section {
        border-top: 1px solid var(--border);
        padding-top: 12px;
        margin-top: 12px;
      }
      .section-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        margin: 0 0 8px;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .toggle-row label { margin: 0; font-weight: 600; cursor: pointer; }
      .switch {
        appearance: none;
        position: relative;
        width: 34px;
        height: 20px;
        margin: 0;
        flex-shrink: 0;
        border-radius: 10px;
        background: #c4c4c4;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        transition: transform 0.15s ease;
      }
      .switch:checked { background: var(--accent); }
      .switch:checked::after { transform: translateX(14px); }
      .switch:disabled { opacity: 0.6; cursor: default; }
      .recent-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      .recent-item {
        position: relative;
        aspect-ratio: 1;
        border-radius: 6px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.05);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        font-weight: 700;
        font-size: 16px;
        text-decoration: none;
      }
      .recent-item:hover, .recent-item:focus-visible { border-color: var(--accent); }
      .recent-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .recent-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
        margin-top: 10px;
      }
      label:first-of-type { margin-top: 0; }
      input[type="text"], input[type="email"], input[type="password"], input[type="url"] {
        width: 100%;
        padding: 7px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      button {
        margin-top: 14px;
        width: 100%;
        padding: 8px 10px;
        border: none;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      .error {
        color: var(--danger);
        font-size: 12px;
        margin-top: 8px;
        display: none;
      }
      .error.visible { display: block; }
      .note {
        font-size: 11px;
        line-height: 1.4;
        color: var(--text-muted);
        margin: 10px 0 0;
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="icons/thingport-icon-color.svg" alt="" />
      <div class="header-text">
        <h1>Thingport Grab</h1>
        <div class="instance-row" id="instance-row" hidden>
          <span class="instance-url" id="instance-url-text"></span>
          <button type="button" class="icon-btn" id="edit-instance-btn" aria-label="Edit instance" title="Edit instance">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div id="configured-view" hidden>
      <div class="toggle-row">
        <label for="enabled-switch">Extension enabled</label>
        <input type="checkbox" role="switch" class="switch" id="enabled-switch" />
      </div>
      <div class="section" id="recent-section" hidden>
        <h2 class="section-title">Recent imports</h2>
        <div class="recent-grid" id="recent-grid"></div>
      </div>
      <div class="error" id="configured-error"></div>
    </div>

    <form id="setup-form">
      <label for="instance-url">Thingport instance URL</label>
      <input type="url" id="instance-url" placeholder="https://thingport.example.com" required />
      <label for="email">Email</label>
      <input type="email" id="email" required />
      <label for="password">Password</label>
      <input type="password" id="password" required />
      <p class="note">
        If you're logged into MakerWorld in this browser, Thingport Grab reads your MakerWorld
        session cookie locally to import from it -- it's sent only to the instance URL above, never
        anywhere else.
      </p>
      <button type="submit" id="save-btn">Save</button>
      <button type="button" class="secondary" id="cancel-btn" hidden>Cancel</button>
      <div class="error" id="error"></div>
    </form>

    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
