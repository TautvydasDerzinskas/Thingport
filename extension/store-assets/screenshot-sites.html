<!doctype html>
<!-- Store screenshot 4, 1280x800: every site Grab works on, by its logo, over five model pages' corners fanned out like a
     hand of cards, each with Grab's button or its panel open. Rendered by `npm run store-assets`
     (scripts/store-assets.ts) from the corners `npm run screenshots -- --corners` takes of the live sites; a card whose
     site has none is left out. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <style>
      html,
      body {
        width: 1280px;
        height: 800px;
      }
      .grid {
        mask-image: radial-gradient(60% 50% at 50% 20%, #000 0%, transparent 85%);
      }
      header {
        position: absolute;
        top: 34px;
        left: 0;
        right: 0;
        text-align: center;
      }
      .eyebrow {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent-light);
      }
      h1 {
        margin-top: 8px;
        font-size: 42px;
        line-height: 1.08;
      }
      header p {
        margin-top: 10px;
        font-size: 17px;
        font-weight: 500;
      }
      .logos {
        position: absolute;
        top: 178px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 9px;
      }
      .logos .chip {
        --chip: 40px;
      }
      /* Five cards round a point far below the picture, so they fan out like a hand of cards. */
      .fan {
        position: absolute;
        left: 640px;
        top: 1575px;
        width: 0;
        height: 0;
      }
      .card {
        position: absolute;
        left: -160px;
        top: -1230px;
        width: 320px;
        height: 256px;
        transform-origin: 160px 1230px;
        overflow: hidden;
        border-radius: 16px;
        background: #fff;
        box-shadow:
          0 24px 56px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.1);
      }
      .card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: right bottom;
      }
      .label {
        position: absolute;
        left: 12px;
        top: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 13px 6px 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.95);
        color: #1b2033;
        font-size: 15px;
        font-weight: 700;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
      }
      .label__logo {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #f1f3f6;
      }
      .label__logo svg {
        width: 19px;
        height: 19px;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <header>
      <div class="eyebrow">On every model page</div>
      <h1>
        Import from <em><span id="count">23</span> sites</em>
      </h1>
      <p>
        Grab's button waits in the corner of each model page, and one click sends the model to your Thingport instance.
      </p>
    </header>
    <div class="logos" id="logos"></div>
    <div class="fan" id="fan"></div>
    <script>
      const CARDS = [
        ["printables", "button"],
        ["crealitycloud", "panel"],
        ["makerworld", "panel"],
        ["thingiverse", "panel"],
        ["snapmaker", "button"],
      ];
      const STEP = 10.5;

      window.render = ({ corners }) => {
        document.getElementById("count").textContent = corners.length;
        const logos = document.getElementById("logos");
        for (const corner of corners) {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.innerHTML = corner.logo;
          logos.append(chip);
        }
        const fan = document.getElementById("fan");
        const cards = CARDS.map(([id, kind]) => corners.find((c) => c.id === id && (c[kind] || c.button)))
          .filter(Boolean)
          .map((corner, i) => ({ corner, kind: CARDS.find(([id]) => id === corner.id)[1], i }));
        const middle = (cards.length - 1) / 2;
        // The middle card on top, the outer ones under it.
        for (const { corner, kind, i } of cards.toSorted((a, b) => Math.abs(b.i - middle) - Math.abs(a.i - middle))) {
          const card = document.createElement("div");
          card.className = "card";
          card.style.transform = `rotate(${(i - middle) * STEP}deg)`;
          card.innerHTML =
            `<img alt="" src="${corner[kind] ?? corner.button}" />` +
            `<div class="label"><span class="label__logo">${corner.logo}</span><span class="label__name"></span></div>`;
          card.querySelector(".label__name").textContent = corner.name;
          fan.append(card);
        }
      };
    </script>
  </body>
</html>
