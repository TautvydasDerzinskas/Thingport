<!doctype html>
<!-- Store screenshot 2, 1280x800: the popup before it's connected, then its Providers, Appearance and History tabs
     once it is (Extra features has a picture of its own, screenshot-features.html). Rendered by `npm run store-assets`
     (scripts/store-assets.ts) from docs/screenshots/popup-*.png, which `npm run screenshots` takes of the real popup. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <style>
      html,
      body {
        width: 1280px;
        height: 800px;
      }
      .grid {
        mask-image: radial-gradient(70% 60% at 50% 30%, #000 0%, transparent 85%);
      }
      header {
        position: absolute;
        top: 66px;
        left: 0;
        right: 0;
        text-align: center;
      }
      .eyebrow {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent-light);
      }
      h1 {
        margin-top: 10px;
        font-size: 44px;
        line-height: 1.1;
      }
      header p {
        margin-top: 10px;
        font-size: 18px;
        font-weight: 500;
      }
      .row {
        position: absolute;
        top: 222px;
        left: 26px;
        right: 26px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
      .step__head {
        display: grid;
        grid-template-columns: 28px 1fr;
        gap: 10px;
        height: 70px;
      }
      .step__num {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 15px;
        font-weight: 700;
        color: #fff;
        background: var(--accent);
      }
      .step__head b {
        display: block;
        font-size: 19px;
        line-height: 28px;
        color: var(--heading);
      }
      .step__head span {
        display: block;
        font-size: 14px;
        line-height: 1.35;
      }
      /* The popup hangs below its caption, as it drops from the toolbar. */
      .step__shot {
        margin-top: 10px;
        max-height: 520px;
        overflow: hidden;
        border-radius: 14px;
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(255, 255, 255, 0.08);
        background: #fff;
      }
      .step__shot img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <header>
      <div class="eyebrow">In the toolbar</div>
      <h1>Set it up once, <em>then just browse</em></h1>
      <p>
        Pair with your Thingport instance, pick the sites and Grab's look, and find what you imported, all from the
        popup.
      </p>
    </header>
    <div class="row" id="row"></div>
    <script>
      const STEPS = [
        {
          popup: "setup",
          title: "Pair with Thingport",
          text: "Approve this browser in Thingport. No password is saved.",
        },
        {
          popup: "connected",
          title: "Choose the sites",
          text: ({ providers }) => `All ${providers.length} sites, each on or off, and where Download adapted works.`,
        },
        {
          popup: "appearance",
          title: "Its look, in your language",
          text: "Eight languages, and six looks for its button in any corner.",
        },
        { popup: "history", title: "History", text: "What you imported, and the models you looked at lately." },
      ];

      window.render = (data) => {
        const row = document.getElementById("row");
        STEPS.forEach((step, i) => {
          const el = document.createElement("div");
          el.className = "step";
          el.innerHTML =
            `<div class="step__head"><div class="step__num">${i + 1}</div><div><b></b><span></span></div></div>` +
            `<div class="step__shot"><img alt="" /></div>`;
          el.querySelector("b").textContent = step.title;
          el.querySelector("span").textContent = typeof step.text === "function" ? step.text(data) : step.text;
          const img = el.querySelector("img");
          if (data.popups[step.popup]) img.src = data.popups[step.popup];
          else el.querySelector(".step__shot").remove();
          row.append(el);
        });
      };
    </script>
  </body>
</html>
