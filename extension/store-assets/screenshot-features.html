<!doctype html>
<!-- Store screenshot 3, 1280x800: Extra features, which need no Thingport instance. The popup's Extra features tab and
     Thingiverse in Grab's dark theme, beside Download adapted on each site it works on. Rendered by
     `npm run store-assets` (scripts/store-assets.ts) from docs/screenshots/popup-features.png and the pictures
     `npm run screenshots -- --adapted` takes of the live sites; a site with none is left out. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="common.css" />
    <style>
      html,
      body {
        width: 1280px;
        height: 800px;
      }
      .grid {
        mask-image: radial-gradient(55% 45% at 22% 12%, #000 0%, transparent 85%);
      }
      header {
        position: absolute;
        top: 40px;
        left: 40px;
        right: 40px;
      }
      .eyebrow {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent-light);
      }
      h1 {
        margin-top: 8px;
        font-size: 42px;
        line-height: 1.08;
      }
      header p {
        margin-top: 10px;
        font-size: 17px;
        line-height: 1.4;
        font-weight: 500;
        max-width: 860px;
      }
      .side {
        position: absolute;
        top: 214px;
        left: 40px;
        width: 340px;
        display: grid;
        gap: 18px;
      }
      .shot {
        overflow: hidden;
        border-radius: 14px;
        background: #fff;
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      .shot img {
        display: block;
        width: 100%;
      }
      /* A model page in Grab's dark theme: its top, where the theme shows most. */
      .dark {
        position: relative;
        height: 212px;
        background: #0f1320;
      }
      .dark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: left top;
      }
      .sites {
        position: absolute;
        top: 214px;
        left: 412px;
        right: 40px;
        bottom: 46px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: 1fr;
        gap: 18px;
      }
      .tile {
        position: relative;
        overflow: hidden;
        border-radius: 14px;
        background: #fff;
        box-shadow:
          0 14px 34px rgba(0, 0, 0, 0.45),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      /* Each picture has Grab's button across its middle, a little below; that's what's brought closer. */
      .tile img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.45);
        transform-origin: 50% 62%;
      }
      .label {
        position: absolute;
        left: 10px;
        top: 10px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 11px 5px 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.95);
        color: #1b2033;
        font-size: 13.5px;
        font-weight: 700;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
      }
      .label__logo {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #f1f3f6;
      }
      .label__logo svg {
        width: 17px;
        height: 17px;
      }
      .label--dark {
        background: rgba(23, 28, 46, 0.92);
        color: #e6e9f2;
      }
      .label--dark .label__logo {
        background: #262e47;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <header>
      <div class="eyebrow">Extra features, no Thingport needed</div>
      <h1>A 3MF <em>made for your slicer and printer</em></h1>
      <p id="lead">
        Download adapted sits beside the site's own button, and makes the copy in your browser. Thingiverse gets a dark
        theme, without its ads.
      </p>
    </header>
    <div class="side" id="side"></div>
    <div class="sites" id="sites"></div>
    <script>
      function label(site, dark) {
        const el = document.createElement("div");
        el.className = dark ? "label label--dark" : "label";
        el.innerHTML = `<span class="label__logo">${site.logo}</span><span class="label__name"></span>`;
        el.querySelector(".label__name").textContent = site.name;
        return el;
      }

      window.render = ({ popups, adapted, thingiverseDark, providers }) => {
        const shown = adapted.filter((site) => site.src);
        document.getElementById("lead").textContent =
          `Download adapted sits beside the site's own button on ${shown.length} sites, and makes the copy in your ` +
          "browser. Thingiverse gets a dark theme, without its ads.";
        const side = document.getElementById("side");
        if (popups.features) {
          const shot = document.createElement("div");
          shot.className = "shot";
          shot.innerHTML = `<img alt="" src="${popups.features}" />`;
          side.append(shot);
        }
        if (thingiverseDark) {
          const shot = document.createElement("div");
          shot.className = "shot dark";
          shot.innerHTML = `<img alt="" src="${thingiverseDark}" />`;
          shot.append(
            label(
              providers.find((p) => p.id === "thingiverse"),
              true,
            ),
          );
          side.append(shot);
        }
        const sites = document.getElementById("sites");
        for (const site of shown) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.innerHTML = `<img alt="" src="${site.src}" />`;
          tile.append(label(site));
          sites.append(tile);
        }
      };
    </script>
  </body>
</html>
