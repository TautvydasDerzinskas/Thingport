<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -45 530 175" fill="none">
  <title>First day of spring</title>
  <style>
    .sway { transform-origin: 0 0; animation: sway 3s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    .grow { transform-origin: 0 0; animation: grow 3s ease-in-out infinite; }
    @keyframes grow { 0%, 100% { transform: scale(0.9) rotate(-4deg); } 50% { transform: scale(1.05) rotate(4deg); } }
    .fly { animation: fly 10s ease-in-out infinite; }
    @keyframes fly { 0%, 100% { transform: translate(120px, -22px); } 25% { transform: translate(230px, -32px); } 50% { transform: translate(340px, -18px); } 75% { transform: translate(200px, -8px); } }
    .wing { transform-origin: 0 0; animation: wing 0.3s ease-in-out infinite alternate; }
    @keyframes wing { to { transform: scaleX(0.3); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fall { display: none; } }
  </style>
