<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -45 530 175" fill="none">
  <title>Halloween</title>
  <style>
    .fly { animation: fly 9s linear infinite; }
    @keyframes fly { 0% { transform: translate(-40px, 0); } 25% { transform: translate(100px, -8px); } 50% { transform: translate(240px, 4px); } 75% { transform: translate(380px, -6px); } 100% { transform: translate(540px, 0); } }
    .flap { transform-origin: 0 0; animation: flap 0.35s ease-in-out infinite alternate; }
    @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(0.35); } }
    .drop { animation: drop 4.5s ease-in-out infinite; }
    @keyframes drop { 0%, 100% { transform: translateY(0); } 45%, 60% { transform: translateY(16px); } }
    .glow { animation: glow 2.2s steps(1) infinite; }
    @keyframes glow { 30% { opacity: 0.55; } 34% { opacity: 1; } 70% { opacity: 0.75; } 74% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .fly { display: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fall, .rise { display: none; } }
  </style>
  <g fill="#2b2b3a" stroke="#8a8aa0" stroke-width="0.8" stroke-linejoin="round">
  <g class="fly" style="animation-delay:0s"><g transform="translate(0 -26) scale(1.0)"><g class="flap"><path d="M0 0 C-5 -7 -13 -8 -20 -4 C-16 -1 -15 3 -13 5 C-10 2 -6 2 0 3 Z"/><path d="M0 0 C-5 -7 -13 -8 -20 -4 C-16 -1 -15 3 -13 5 C-10 2 -6 2 0 3 Z" transform="scale(-1 1)"/></g><ellipse cx="0" cy="1" rx="3.2" ry="4.5"/><path d="M-2.5 -2.5 L-2.5 -6.5 L-0.8 -3.5 Z M2.5 -2.5 L2.5 -6.5 L0.8 -3.5 Z"/></g></g>
  <g class="fly" style="animation-delay:-4.5s"><g transform="translate(0 -12) scale(0.75)"><g class="flap"><path d="M0 0 C-5 -7 -13 -8 -20 -4 C-16 -1 -15 3 -13 5 C-10 2 -6 2 0 3 Z"/><path d="M0 0 C-5 -7 -13 -8 -20 -4 C-16 -1 -15 3 -13 5 C-10 2 -6 2 0 3 Z" transform="scale(-1 1)"/></g><ellipse cx="0" cy="1" rx="3.2" ry="4.5"/><path d="M-2.5 -2.5 L-2.5 -6.5 L-0.8 -3.5 Z M2.5 -2.5 L2.5 -6.5 L0.8 -3.5 Z"/></g></g>
  </g>
  <g transform="translate(90 -2)"><g class="drop">
    <line x1="0" y1="-120" x2="0" y2="0" stroke="#9aa4ae" stroke-width="1"/>
    <g stroke="#2b2b3a" stroke-width="1.3" fill="none" stroke-linecap="round"><path d="M-3 -3 Q-9 -8 -12 0"/><path d="M-3 -1 Q-9 -6 -12 2"/><path d="M-3 1 Q-9 -4 -12 4"/><path d="M-3 3 Q-9 -2 -12 6"/><path d="M3 -3 Q9 -8 12 0"/><path d="M3 -1 Q9 -6 12 2"/><path d="M3 1 Q9 -4 12 4"/><path d="M3 3 Q9 -2 12 6"/></g>
    <ellipse cx="0" cy="2" rx="4.5" ry="5.5" fill="#2b2b3a" stroke="#8a8aa0" stroke-width="0.8"/>
    <circle cx="-1.6" cy="0.5" r="1" fill="#ff3b3b"/><circle cx="1.6" cy="0.5" r="1" fill="#ff3b3b"/>
  </g></g>
  <rect x="452" y="34" width="6" height="10" rx="2" fill="#4a7c2a"/>
  <g fill="#f77f00" stroke="#c25e00" stroke-width="1.6">
    <ellipse cx="443" cy="60" rx="14" ry="17"/><ellipse cx="467" cy="60" rx="14" ry="17"/><ellipse cx="455" cy="60" rx="15" ry="18"/>
  </g>
  <g class="glow" fill="#ffd23f">
    <path d="M444 52 L449 60 L439 60 Z M466 52 L471 60 L461 60 Z"/>
    <path d="M441 66 L446 70 L450 66 L455 71 L460 66 L464 70 L469 66 L466 73 Q455 79 444 73 Z"/>
  </g>
</svg>
