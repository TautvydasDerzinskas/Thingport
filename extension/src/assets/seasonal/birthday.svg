<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -45 530 175" fill="none">
  <title>Thingport's birthday</title>
  <style>
    .fall { animation: fall linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes fall { 0% { transform: translateY(0) rotate(0); opacity: 0; } 10%, 85% { opacity: 1; } 100% { transform: translateY(160px) rotate(540deg); opacity: 0; } }

    .sway { transform-origin: 0 0; animation: sway 3s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    .flame { transform-origin: 0 4px; animation: flicker 0.5s ease-in-out infinite alternate; }
    @keyframes flicker { from { transform: scale(1, 1) rotate(-4deg); } to { transform: scale(0.85, 1.15) rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fall, .rise { display: none; } }
  </style>
  <g transform="translate(50 20) rotate(10)"><g class="sway">
