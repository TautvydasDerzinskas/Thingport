  <circle cx="436" cy="66" r="2" fill="#ffc300"/><circle cx="448" cy="68" r="2" fill="#00b4ff"/><circle cx="462" cy="66" r="2" fill="#00b800"/><circle cx="474" cy="68" r="2" fill="#ffc300"/>
