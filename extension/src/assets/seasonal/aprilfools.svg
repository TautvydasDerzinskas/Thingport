<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -45 530 175" fill="none">
  <title>April Fools' Day</title>
  <!-- Grab's own, not the web app's (which turns its logo upside down instead): the mark in a Groucho disguise. -->
  <style>
    .brows { animation: waggle 3.2s ease-in-out infinite; }
    @keyframes waggle { 0%, 78%, 100% { transform: translateY(0); } 83% { transform: translateY(-5px); } 88% { transform: translateY(0); } 93% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <path d="M30 44 L22 39" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
  <path d="M70 44 L78 39" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="40" cy="45" r="10" fill="#ffffff" fill-opacity="0.45" stroke="#1f1f1f" stroke-width="3.2"/>
  <circle cx="60" cy="45" r="10" fill="#ffffff" fill-opacity="0.45" stroke="#1f1f1f" stroke-width="3.2"/>
  <path d="M48.5 44 Q50 42 51.5 44" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="42" cy="47" r="2.6" fill="#1f1f1f"/>
  <circle cx="58" cy="47" r="2.6" fill="#1f1f1f"/>
  <g class="brows">
    <path d="M29 32 Q38 24 48 31" stroke="#1f1f1f" stroke-width="5" stroke-linecap="round"/>
    <path d="M52 31 Q62 24 71 32" stroke="#1f1f1f" stroke-width="5" stroke-linecap="round"/>
  </g>
  <ellipse cx="50" cy="56" rx="6.5" ry="8" fill="#f4a98f" stroke="#c97a62" stroke-width="1.2"/>
  <ellipse cx="48" cy="53" rx="1.8" ry="2.4" fill="#ffffff" fill-opacity="0.6"/>
  <path d="M33 66 Q41 59 50 64 Q59 59 67 66 Q62 72 50 68 Q38 72 33 66 Z" fill="#3b2a20"/>
</svg>
