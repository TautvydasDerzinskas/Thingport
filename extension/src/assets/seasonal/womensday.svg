    <path d="M0 0 Q6.4 -23.0 16 -46" stroke="#3f9a3f" stroke-width="2.4" stroke-linecap="round"/>
    <g transform="translate(16 -46)"><path class="nod" style="animation-delay:-1.4s" d="M-7 0 C-9 -8 -7 -14 -5 -16 L-2.5 -11 L0 -17 L2.5 -11 L5 -16 C7 -14 9 -8 7 0 Q0 4 -7 0 Z" fill="#ffc300" stroke="#d9a400" stroke-width="1.2" stroke-linejoin="round"/></g>
