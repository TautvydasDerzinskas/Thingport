    <g transform="translate(-16 -48)"><path class="nod" style="animation-delay:0s" d="M-7 0 C-9 -8 -7 -14 -5 -16 L-2.5 -11 L0 -17 L2.5 -11 L5 -16 C7 -14 9 -8 7 0 Q0 4 -7 0 Z" fill="#ff6fa5" stroke="#d94a85" stroke-width="1.2" stroke-linejoin="round"/></g>
