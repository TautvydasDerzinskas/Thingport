<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -45 530 175" fill="none">
  <title>International Women's Day</title>
  <style>
    .fall { animation: fall linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes fall { 0% { transform: translateY(0) rotate(0); opacity: 0; } 10%, 85% { opacity: 1; } 100% { transform: translateY(160px) rotate(540deg); opacity: 0; } }

    .sway { transform-origin: 0 0; animation: sway 3.4s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    .nod { transform-origin: 0 0; animation: nod 2.2s ease-in-out infinite; }
    @keyframes nod { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fall, .rise { display: none; } }
  </style>
  <g transform="translate(455 82)"><g class="sway">
