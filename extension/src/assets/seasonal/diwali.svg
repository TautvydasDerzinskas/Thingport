  <title>Diwali</title>
  <style>
    .flame { transform-origin: 0 4px; animation: flicker 0.5s ease-in-out infinite alternate; }
    @keyframes flicker { from { transform: scale(1, 1) rotate(-4deg); } to { transform: scale(0.85, 1.15) rotate(4deg); } }
    .twinkle { transform-origin: 0 0; animation: twinkle 1.8s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.5); opacity: 0.4; } }
    .bulb { animation: blink 1.4s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fall { display: none; } }
  </style>
