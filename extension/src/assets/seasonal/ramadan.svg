<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -45 530 175" fill="none">
  <title>Ramadan and Eid al-Fitr</title>
  <style>
    .twinkle { transform-origin: 0 0; animation: twinkle 1.8s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.5); opacity: 0.4; } }
    .sway { transform-origin: 0 0; animation: sway 3.6s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fall { display: none; } }
  </style>
