# CodeRabbit review settings: https://docs.coderabbit.ai/reference/configuration
# Formatting (Prettier, gofmt, prisma format) and linting (oxlint) are already enforced by the pre-commit
# hook and CI, so reviews are steered towards correctness, security and design rather than style.
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-GB

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  # Only PRs into the default branch (develop) are reviewed automatically, and only when opened or marked ready for
  # review. Release PRs from develop into main carry work that was already reviewed on its way into develop; comment
  # `@coderabbitai review` on one to review it anyway.
  auto_review:
    enabled: true
    drafts: false
    # A push isn't reviewed on its own: a round ends with `@coderabbitai review` once every thread is answered, so a
    # review never lands on a half-answered round (docs/STORAGE_DEVELOPMENT.md, "Reviews").
    auto_incremental_review: false
    auto_pause_after_reviewed_commits: 0

  # Pull requests in a series link issues they only partly fix.
  pre_merge_checks:
    issue_assessment:
      mode: "off"

  path_filters:
    # Generated or tool-owned files
    - "!**/package-lock.json"
    - "!**/CHANGELOG.md"
    - "!web/.astro/**"
    - "!**/dist/**"
    - "!backend/assets/printers/**"
    # Written by the sync scripts from sources that are reviewed (the providers', adapter's and Studio's copies, the
    # SDK reference from frontend/src/sdk/types.ts); Format's *:check steps keep them in step. Left out, as the
    # translations below are, so a pull request near the 100-file review limit stays reviewed.
    - "!**/*.generated.*"
    - "!docs/developers/sdk-reference.md"
    - "!docs/developers/examples/thingport.d.ts"
    # Translations of en.json, which is reviewed; Format's strict locale check fails on a key one misses or keeps.
    - "!frontend/src/i18n/locales/be.json"
    - "!frontend/src/i18n/locales/de.json"
    - "!frontend/src/i18n/locales/es.json"
    - "!frontend/src/i18n/locales/fr.json"
    - "!frontend/src/i18n/locales/lt.json"
    - "!frontend/src/i18n/locales/ru.json"
    - "!frontend/src/i18n/locales/uk.json"
    - "!frontend/src/i18n/locales/zh.json"
    # Fixtures
    - "!regression/fixtures/**"

  path_instructions:
    - path: "**/*"
      instructions: |
        Formatting and lint rules are enforced by Prettier, gofmt and oxlint in CI -- don't comment on
        style those tools cover. This codebase uses comments that explain *why* something is the way it
        is, especially around workarounds and non-obvious behaviour: flag comments that have gone stale
        relative to the code they describe, but don't ask for comments that only restate the code.
        Commits follow Conventional Commits, and the type decides the next version of each package.

        Thingport is self-hosted, and plain-HTTP instances (on a LAN, or locally, with no TLS certificate) are
        supported on purpose. Don't suggest enforcing HTTPS for the instance or anything that talks to it (the web
        app, the extension, Bridge, MCP and API clients): no redirects to https, HSTS, `upgrade-insecure-requests`,
        cookies marked `Secure` regardless of the request's scheme, or validation that rejects or rewrites an
        `http://` instance URL. Do flag changes that would break plain HTTP, including APIs that exist only in
        secure contexts (`navigator.clipboard`, `crypto.randomUUID`, `crypto.subtle`) used without a fallback, and
        an extension CSP that brings back `upgrade-insecure-requests`. Requiring https for third-party URLs is fine.

    - path: "backend/**"
      instructions: |
        Express + Prisma + TypeScript API. Check routes for missing authentication/authorisation (the app
        is multi-user, so one user must not be able to read or change another's data), unvalidated
        input, path traversal in anything that touches files under storage, and unhandled promise
        rejections. Watch for N+1 queries and unbounded result sets.

    - path: "backend/src/{files,modelFiles,intake,import,providers}/**"
      instructions: |
        How a model's files are stored, moved, imported and deleted is being rebuilt in small pull requests. Flag a
        change that breaks a rule docs/STORAGE_DEVELOPMENT.md lists under "Rules in force". Don't flag code for a rule
        that list doesn't have yet: it isn't in force, and a later pull request brings it in with its tests. Any other
        defect in the change, a regression included, is a finding as usual.

    - path: "backend/src/services/{print*,import*,upload*,consume*,zip*,download*,modelFiles*,missingFiles*,storage*}.ts"
      instructions: |
        How a model's files are stored, moved, imported and deleted is being rebuilt in small pull requests. Flag a
        change that breaks a rule docs/STORAGE_DEVELOPMENT.md lists under "Rules in force". Don't flag code for a rule
        that list doesn't have yet: it isn't in force, and a later pull request brings it in with its tests. Any other
        defect in the change, a regression included, is a finding as usual.

    - path: "backend/src/routes/{plates,printFiles,prints,upload,import}*.ts"
      instructions: |
        How a model's files are stored, moved, imported and deleted is being rebuilt in small pull requests. Flag a
        change that breaks a rule docs/STORAGE_DEVELOPMENT.md lists under "Rules in force". Don't flag code for a rule
        that list doesn't have yet: it isn't in force, and a later pull request brings it in with its tests. Any other
        defect in the change, a regression included, is a finding as usual.

    - path: "backend/prisma/**"
      instructions: |
        Schema and migrations. Flag destructive or data-losing migrations (dropped columns or tables,
        type narrowing, NOT NULL without a default on existing tables) and schema changes that don't
        come with a matching migration.

    - path: "frontend/**"
      instructions: |
        React 18 + Vite + TypeScript with `strict: true`. Flag `any`, unsafe casts and non-null
        assertions used to get past a type error. Check hooks for missing or wrong dependencies, effects
        that don't clean up, and user-facing strings that bypass i18n.

    - path: "extension/**"
      instructions: |
        Browser extension (Chrome, Edge and Firefox) built with esbuild. The background script must run
        both as a Chrome MV3 service worker and as a Firefox event page: flag APIs or globals only one of
        them has (e.g. `importScripts`, `window`, DOM access) and state kept in memory that won't survive
        the service worker being suspended. The content script and popup must not call the Thingport
        instance directly -- they message the background. Review permission changes in the manifest
        closely, and flag anything that would conflict with extension/PRIVACY.md or store policy.

    - path: "extension/scripts/edge-certification-notes.txt"
      instructions: |
        Sent to Microsoft with every Edge submission; Edge rejects notes of 2,000 characters or more once the
        placeholders are filled, and the template is already close to that. Any suggestion must keep the
        file the same length or shorter (`npm run check:edge-notes` must pass): reword or drop text rather
        than add it, and keep providers described as a group instead of listing each one.

    - path: "bridge/**"
      instructions: |
        Go helper that registers the `thingport://` protocol, downloads a file and launches a slicer on
        Windows, Linux and macOS. Treat every URL it receives as untrusted: check for command injection
        when launching processes, path traversal when saving downloads, and unchecked errors. Flag
        platform-specific code that isn't guarded by build tags or a runtime OS check.

    - path: "regression/**"
      instructions: |
        Playwright end-to-end tests against the full stack. Prefer role/label locators and web-first
        assertions over fixed timeouts and brittle CSS selectors.

    - path: ".github/workflows/**"
      instructions: |
        Check for overly broad `permissions`, secrets exposed to pull requests from forks
        (`pull_request_target`), untrusted input interpolated straight into `run:` steps, and third-party
        actions not pinned to a version.

    - path: "**/*.md"
      instructions: |
        Docs are also published to the GitHub wiki and the website. Check that commands, paths and
        behaviour described still match the code, and that relative links resolve.

# Rules reviews read alongside the code: storage's rules in force, and the repo's own instructions.
knowledge_base:
  code_guidelines:
    filePatterns:
      - "docs/STORAGE_DEVELOPMENT.md"
      - ".claude/CLAUDE.md"

chat:
  # Replies in a review thread don't start an answer: the next review checks each fix instead.
  auto_reply: false
