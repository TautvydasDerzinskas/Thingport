<style>
  .printed {
    display: grid;
    grid-template-rows: auto auto 1fr;
    gap: 12px;
    height: 100%;
    padding: 16px;
    box-sizing: border-box;
    font-family: var(--tp-font);
    color: var(--tp-text);
  }
  .printed header {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .printed h2 {
    flex: 1;
    margin: 0;
    font-size: 16px;
  }
  .printed button {
    padding: 6px 10px;
    border: 1px solid var(--tp-divider);
    border-radius: 8px;
    background: var(--tp-paper);
    color: var(--tp-text);
    font: inherit;
    cursor: pointer;
  }
  .printed button.add {
    border-color: transparent;
    background: var(--tp-accent);
    color: var(--tp-accent-ink);
  }
  .printed .status {
    margin: 0;
    font-size: 12px;
    color: var(--tp-text-muted);
  }
  .printed ul {
    margin: 0;
    padding: 0;
    list-style: none;
    overflow: auto;
  }
  .printed li {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid var(--tp-divider);
  }
  .printed li .name {
    flex: 1;
    border: 0;
    padding: 0;
    text-align: start;
    background: none;
  }
</style>
<div class="printed">
  <header>
    <h2 data-t="title">What you've printed</h2>
    <button class="audience" type="button" data-t="everyone">Everyone sees yours</button>
    <button class="add" type="button" data-t="add">Add models</button>
  </header>
  <p class="status"></p>
  <ul></ul>
</div>
