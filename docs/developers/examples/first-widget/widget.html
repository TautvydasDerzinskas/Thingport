<style>
  .newest {
    display: grid;
    gap: 8px;
    padding: 12px;
    font-family: var(--tp-font);
    color: var(--tp-text);
  }
  .newest h3 {
    margin: 0;
    font-size: 14px;
  }
  .newest .status {
    margin: 0;
    font-size: 12px;
    color: var(--tp-text-muted);
  }
  .newest ul {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .newest button {
    width: 100%;
    padding: 0;
    overflow: hidden;
    border: 1px solid var(--tp-divider);
    border-radius: 8px;
    background: var(--tp-paper);
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 150ms;
  }
  .newest button:hover,
  .newest button:focus-visible {
    border-color: var(--tp-accent);
  }
  .newest img {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: var(--tp-background);
  }
  .newest span {
    display: block;
    padding: 4px 6px;
    overflow: hidden;
    font-size: 12px;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  @media (prefers-reduced-motion: reduce) {
    .newest button {
      transition: none;
    }
  }
</style>
<div class="newest">
  <h3 data-t="title">Newest models</h3>
  <p class="status" data-t="loading">Loading…</p>
  <ul></ul>
</div>
