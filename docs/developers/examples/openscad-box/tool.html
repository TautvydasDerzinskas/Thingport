<style>
  .scadbox {
    display: grid;
    gap: 12px;
    padding: 16px;
    font-family: var(--tp-font);
    color: var(--tp-text);
  }
  .scadbox fieldset {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
    margin: 0;
    padding: 8px 0 0;
    border: 0;
    border-top: 1px solid var(--tp-divider);
  }
  .scadbox legend {
    font-weight: 600;
  }
  .scadbox label {
    display: grid;
    gap: 4px;
    font-size: 12px;
    color: var(--tp-text-muted);
  }
  .scadbox input,
  .scadbox button {
    padding: 6px 10px;
    border: 1px solid var(--tp-divider);
    border-radius: 8px;
    background: var(--tp-paper);
    color: var(--tp-text);
    font: inherit;
  }
  .scadbox .actions {
    display: flex;
    gap: 8px;
  }
  .scadbox button {
    cursor: pointer;
  }
  .scadbox button[type="submit"] {
    border-color: transparent;
    background: var(--tp-accent);
    color: var(--tp-accent-ink);
  }
  .scadbox output {
    font-size: 12px;
    white-space: pre-wrap;
    color: var(--tp-text-muted);
  }
</style>
<form class="scadbox">
  <div class="parameters"></div>
  <div class="actions">
    <button type="submit" data-t="make">Make and save…</button>
    <button type="button" class="cancel" data-t="cancel" hidden>Cancel</button>
  </div>
  <output aria-live="polite" data-t="starting">Starting OpenSCAD…</output>
</form>
