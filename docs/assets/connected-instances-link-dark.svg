<path d="M352 149 V137 M372 149 V137" stroke="#9aa0ad" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="353" cy="185" r="2.5" fill="#1fd11f"/><circle cx="362" cy="185" r="2.5" fill="#9aa0ad"/><circle cx="371" cy="185" r="2.5" fill="#9aa0ad"/>
<text x="362" y="214" font-size="12" text-anchor="middle" fill="#9aa0ad">Router</text>
