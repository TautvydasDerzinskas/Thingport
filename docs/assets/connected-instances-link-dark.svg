<text x="540" y="272" font-size="12.5" text-anchor="middle" fill="#ff5c63">Can't reach home directly</text>
<circle cx="40" cy="312" r="5" fill="#1fd11f"/>
<text x="52" y="316.5" font-size="13" fill="#e3e6ee">Requests from the makerspace, down the link</text>
<circle cx="420" cy="312" r="5" fill="#5aa2ff"/>
<text x="432" y="316.5" font-size="13" fill="#e3e6ee">Answers from home, back up the link</text>
</svg>
