<g transform="translate(520,157)" fill="none" stroke="#1fd11f" stroke-width="2" stroke-linejoin="round"><path d="M16 2 L29 9 L29 23 L16 30 L3 23 L3 9 Z"/><path d="M3 9 L16 16 L29 9 M16 16 L16 30"/></g>
