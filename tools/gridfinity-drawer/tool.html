<style>
  /* Everything is under .gfd, so nothing reaches the rest of Thingport. Colours come from Thingport's theme; tool.js
     sets the variables. */
  .gfd {
    --panel-2: color-mix(in srgb, var(--panel) 90%, var(--text));
    --line: var(--divider);
    container-type: inline-size;
    box-sizing: border-box;
    height: 100%;
    overflow: auto;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 var(--font);
  }
  .gfd *,
  .gfd *::before,
  .gfd *::after {
    box-sizing: border-box;
  }
  .gfd button,
  .gfd input,
  .gfd select {
    font: inherit;
    color: inherit;
  }
  .gfd :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .gfd [hidden] {
    display: none !important;
  }

  .gfd-main {
    display: grid;
    gap: 12px;
    padding: 12px;
    align-items: start;
    grid-template-columns: 262px minmax(0, 1fr) 320px;
  }
  /* Side by side, the window's height is shared: each panel scrolls on its own, and the parts list within its panel,
     so Save stays in view however many parts there are. */
  @container (min-width: 1081px) {
    .gfd-main {
      height: 100%;
      grid-template-rows: minmax(0, 1fr);
    }
    .gfd-panel {
      max-height: 100%;
      overflow: auto;
    }
    .gfd-parts {
      overflow: hidden;
    }
    .gfd-parts .gfd-list {
      flex: 0 1 auto;
      min-height: 0;
      overflow-y: auto;
      /* Room for a focused part's outline. */
      margin: -4px;
      padding: 4px;
    }
    .gfd-parts .gfd-list > * {
      flex-shrink: 0;
    }
  }
  @container (max-width: 1080px) {
    .gfd-main {
      grid-template-columns: 262px minmax(0, 1fr);
    }
    .gfd-parts {
      grid-column: 1 / -1;
    }
  }
  @container (max-width: 640px) {
    .gfd-main {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  .gfd-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .gfd-settings {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .gfd-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .gfd-label {
    font-size: 11px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .gfd-row {
    display: grid;
    grid-template-columns: repeat(var(--n, 2), 1fr);
    gap: 8px;
  }
  .gfd-field {
    position: relative;
  }
  .gfd-field input,
  .gfd-field select {
    width: 100%;
    height: 34px;
    padding: 0 26px 0 8px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    outline: none;
    transition: border-color 0.15s;
  }
  /* No spinner arrows: they'd take the room the number needs. */
  .gfd-field input[type="number"] {
    appearance: textfield;
    -moz-appearance: textfield;
  }
  .gfd-field input::-webkit-inner-spin-button,
  .gfd-field input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .gfd-field select {
    padding-right: 9px;
    cursor: pointer;
  }
  .gfd-field input:focus,
  .gfd-field select:focus {
    border-color: var(--accent);
  }
  .gfd-field .gfd-suffix {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 11px;
    pointer-events: none;
  }
  .gfd-field .gfd-prefix {
    position: absolute;
    left: 7px;
    top: -7px;
    padding: 0 4px;
    background: var(--panel);
    color: var(--muted);
    font-size: 10px;
    border-radius: 4px;
  }
  .gfd-name input {
    padding-right: 9px;
  }

  .gfd-seg {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 3px;
  }
  .gfd-seg button {
    border: 0;
    background: transparent;
    border-radius: 6px;
    padding: 6px 8px;
    cursor: pointer;
    color: var(--muted);
    transition:
      background-color 0.18s,
      color 0.18s;
    font-size: 13px;
    white-space: nowrap;
  }
  .gfd-seg button:hover {
    color: var(--text);
  }
  .gfd-seg button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .gfd-hint {
    color: var(--muted);
    font-size: 12px;
  }
  .gfd-hint b {
    color: var(--text);
    font-weight: 600;
  }
  .gfd-facts {
    border-top: 1px dashed var(--line);
    padding-top: 12px;
    display: grid;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  .gfd-facts div {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .gfd-facts b {
    color: var(--text);
    font-weight: 600;
    text-align: right;
  }

  .gfd-stepper {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel-2);
  }
  .gfd-stepper button {
    width: 28px;
    height: 30px;
    border: 0;
    background: none;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    color: var(--muted);
  }
  .gfd-stepper button:hover:not(:disabled) {
    color: var(--text);
  }
  .gfd-stepper button:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .gfd-stepper output {
    min-width: 34px;
    text-align: center;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .gfd-layout {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .gfd-layout-head {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .gfd-dims {
    font-weight: 600;
  }
  .gfd-spacer {
    flex: 1;
  }
  .gfd-btn {
    height: 30px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    transition: border-color 0.15s;
  }
  .gfd-btn:hover:not(:disabled) {
    border-color: var(--muted);
  }
  .gfd-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .gfd-btn.gfd-primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: transparent;
    font-weight: 600;
  }
  .gfd-btn.gfd-danger {
    color: var(--danger);
  }
  .gfd-btn svg {
    width: 14px;
    height: 14px;
  }
  .gfd-stage {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 300px;
  }
  .gfd-stage svg {
    width: 100%;
    max-height: 56vh;
    display: block;
    touch-action: none;
    user-select: none;
  }
  .gfd-stage svg:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 6px;
  }
  .gfd-stage .gfd-cell {
    fill: transparent;
    stroke: color-mix(in srgb, var(--text) 16%, transparent);
  }
  .gfd-stage .gfd-bin {
    cursor: grab;
    transition: opacity 0.15s;
  }
  .gfd-stage .gfd-bin.gfd-enter {
    animation: gfd-pop 0.22s ease-out both;
  }
  .gfd-empty {
    text-align: center;
    color: var(--muted);
    max-width: 300px;
  }
  .gfd-empty strong {
    display: block;
    color: var(--text);
    margin-bottom: 4px;
  }
  .gfd-selected {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 14px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--panel-2);
    animation: gfd-rise 0.2s ease-out;
  }
  .gfd-selected .gfd-label {
    margin-right: 2px;
  }
  .gfd-selected .gfd-pair {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .gfd-parts {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .gfd-parts h2 {
    margin: 0;
    font-size: 14px;
  }
  .gfd-view {
    position: relative;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    height: 190px;
    border-radius: 10px;
    background: var(--panel-2);
    cursor: grab;
    touch-action: none;
  }
  .gfd-view canvas {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: block;
  }
  .gfd-view .gfd-view-name {
    padding: 0 10px 8px;
    font-size: 12px;
    color: var(--muted);
    pointer-events: none;
  }
  .gfd-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .gfd-part {
    display: grid;
    grid-template-columns: 52px 1fr auto auto;
    align-items: center;
    gap: 10px;
    padding: 5px 8px;
    border-radius: 9px;
    background: var(--panel-2);
    border: 1px solid transparent;
    cursor: pointer;
    animation: gfd-rise 0.25s ease-out both;
    transition: border-color 0.15s;
  }
  .gfd-part:hover,
  .gfd-part:focus-visible,
  .gfd-part[aria-current="true"] {
    border-color: var(--accent);
  }
  .gfd-part canvas {
    width: 52px;
    height: 40px;
    display: block;
  }
  .gfd-part .gfd-part-name {
    font-size: 13px;
    line-height: 1.25;
  }
  .gfd-part .gfd-part-name small {
    display: block;
    color: var(--muted);
    font-size: 11px;
  }
  .gfd-part .gfd-qty {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .gfd-part .gfd-qty small {
    color: var(--muted);
    font-weight: 400;
  }
  .gfd-icon-btn {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    border: 0;
    background: none;
    cursor: pointer;
    color: var(--muted);
    display: grid;
    place-items: center;
  }
  .gfd-icon-btn:hover {
    color: var(--text);
    background: color-mix(in srgb, var(--text) 8%, transparent);
  }
  .gfd-icon-btn svg {
    width: 15px;
    height: 15px;
  }
  .gfd-problems {
    margin: 0;
    padding: 8px 10px 8px 26px;
    border-radius: 9px;
    background: color-mix(in srgb, var(--danger) 10%, transparent);
    color: var(--danger);
    font-size: 12px;
  }
  .gfd-save {
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-top: 1px dashed var(--line);
    padding-top: 12px;
  }
  .gfd-save .gfd-btn.gfd-primary {
    height: 36px;
    justify-content: center;
  }
  .gfd-status {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    animation: gfd-rise 0.2s ease-out;
  }
  .gfd-link {
    border: 0;
    background: none;
    padding: 0;
    color: var(--accent);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  .gfd-part.gfd-still {
    animation: none;
  }
  @keyframes gfd-rise {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
  @keyframes gfd-pop {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .gfd *,
    .gfd *::before,
    .gfd *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
<div class="gfd">
  <main class="gfd-main">
    <section class="gfd-panel gfd-settings" aria-label="Drawer and printer">
      <div class="gfd-group">
        <div class="gfd-label">Project</div>
        <div class="gfd-field gfd-name">
          <input id="gfd-name" maxlength="120" autocomplete="off" aria-label="Project name" placeholder="Desk drawer" />
        </div>
      </div>
      <div class="gfd-group">
        <div class="gfd-label">Drawer inside</div>
        <div class="gfd-row" style="--n: 3">
          <div class="gfd-field">
            <span class="gfd-prefix">Width</span
            ><input id="gfd-width" type="number" min="40" max="2000" step="1" aria-label="Drawer width" /><span
              class="gfd-suffix"
              >mm</span
            >
          </div>
          <div class="gfd-field">
            <span class="gfd-prefix">Depth</span
            ><input id="gfd-depth" type="number" min="40" max="2000" step="1" aria-label="Drawer depth" /><span
              class="gfd-suffix"
              >mm</span
            >
          </div>
          <div class="gfd-field">
            <span class="gfd-prefix">Height</span
            ><input id="gfd-height" type="number" min="10" max="500" step="1" aria-label="Drawer height" /><span
              class="gfd-suffix"
              >mm</span
            >
          </div>
        </div>
      </div>
      <div class="gfd-group">
        <div class="gfd-label">Printer bed</div>
        <div class="gfd-field">
          <select id="gfd-bedPreset" aria-label="Printer bed preset"></select>
        </div>
        <div class="gfd-row">
          <div class="gfd-field">
            <span class="gfd-prefix">X</span
            ><input id="gfd-bedX" type="number" min="60" max="1000" step="1" aria-label="Bed width" /><span
              class="gfd-suffix"
              >mm</span
            >
          </div>
          <div class="gfd-field">
            <span class="gfd-prefix">Y</span
            ><input id="gfd-bedY" type="number" min="60" max="1000" step="1" aria-label="Bed depth" /><span
              class="gfd-suffix"
              >mm</span
            >
          </div>
        </div>
      </div>
      <div class="gfd-group">
        <div class="gfd-label">Cells</div>
        <div class="gfd-seg" role="group" aria-label="Cell size" id="gfd-cells">
          <button type="button" data-value="gridfinity">Gridfinity 42</button>
          <button type="button" data-value="stretch">Fill exactly</button>
        </div>
        <div class="gfd-hint" id="gfd-cellsHint"></div>
      </div>
      <div class="gfd-group">
        <div class="gfd-label">Room to the walls</div>
        <div class="gfd-field">
          <input id="gfd-clearance" type="number" min="0" max="10" step="0.5" aria-label="Room to the walls" /><span
            class="gfd-suffix"
            >mm</span
          >
        </div>
      </div>
      <div class="gfd-group">
        <div class="gfd-label">New bins</div>
        <div class="gfd-hint">
          <span class="gfd-stepper" role="group" aria-label="Height of new bins"
            ><button type="button" id="gfd-unitsDown" aria-label="Lower">−</button><output id="gfd-units"></output
            ><button type="button" id="gfd-unitsUp" aria-label="Taller">+</button></span
          >
          <span id="gfd-unitsMm"></span>
        </div>
      </div>
      <div class="gfd-facts" id="gfd-facts" aria-live="polite"></div>
    </section>

    <section class="gfd-panel gfd-layout" aria-label="Drawer layout">
      <div class="gfd-layout-head">
        <span class="gfd-dims" id="gfd-dims"></span>
        <span class="gfd-hint">Drag to draw a bin, drag a bin to move it</span>
        <span class="gfd-spacer"></span>
        <button class="gfd-btn" id="gfd-fill" title="A 1×1 bin in every free cell">Fill gaps</button>
        <button class="gfd-btn" id="gfd-clear">Clear bins</button>
      </div>
      <div class="gfd-stage" id="gfd-stage"></div>
      <div class="gfd-selected" id="gfd-selected" hidden></div>
    </section>

    <section class="gfd-panel gfd-parts" aria-label="Parts">
      <h2>Parts <span class="gfd-hint" id="gfd-count"></span></h2>
      <div class="gfd-view" id="gfd-view" title="Drag to turn it">
        <canvas id="gfd-viewCanvas" aria-label="The part, in 3D"></canvas>
        <span class="gfd-view-name" id="gfd-viewName"></span>
      </div>
      <ul class="gfd-problems" id="gfd-problems" hidden></ul>
      <ul class="gfd-list" id="gfd-list"></ul>
      <div class="gfd-save">
        <button class="gfd-btn gfd-primary" id="gfd-save">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M5 4h11l3 3v13H5z" />
            <path d="M8 4v5h7V4M8 20v-6h8v6" />
          </svg>
          Save to Thingport
        </button>
        <div class="gfd-hint">Every part as one model, with how many to print of each in its description.</div>
        <div class="gfd-status" id="gfd-status" aria-live="polite" hidden></div>
      </div>
    </section>
  </main>
</div>
