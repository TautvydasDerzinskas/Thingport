<style>
  .pq {
    --pq-radius: 10px;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 14px 16px 16px;
    font-family: var(--tp-font);
    font-size: 13px;
    color: var(--tp-text);
    background: var(--tp-background);
  }
  .pq [hidden] {
    display: none !important;
  }
  .pq :where(button) {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }
  .pq :where(button:focus-visible, [tabindex]:focus-visible) {
    outline: 2px solid var(--tp-accent);
    outline-offset: 2px;
  }
  .pq-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .pq-people {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .pq-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 10px 0 4px;
    border: 1px solid var(--tp-divider);
    border-radius: 14px;
    background: var(--tp-paper);
    white-space: nowrap;
    transition:
      border-color 150ms,
      background-color 150ms;
  }
  .pq-chip.pq-plain {
    padding-left: 10px;
  }
  .pq-chip[aria-pressed="true"] {
    border-color: var(--tp-accent);
    background: color-mix(in srgb, var(--tp-accent) 12%, var(--tp-paper));
  }
  .pq-spacer {
    flex: 1;
  }
  .pq-share {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 12px;
    border: 1px solid var(--tp-divider);
    border-radius: 8px;
    background: var(--tp-paper);
    color: var(--tp-text);
  }
  .pq-share svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }
  .pq-av {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    background: var(--pq-person, var(--tp-text-muted));
    overflow: hidden;
  }
  .pq-av img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .pq-board {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, minmax(180px, 1fr));
    gap: 10px;
    overflow-x: auto;
  }
  .pq-col {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-radius: var(--pq-radius);
    background: color-mix(in srgb, var(--tp-text) 4%, var(--tp-background));
    outline: 2px dashed transparent;
    outline-offset: -2px;
    transition: outline-color 150ms;
  }
  .pq-col.pq-over {
    outline-color: var(--tp-accent);
  }
  .pq-col h3 {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 0;
    padding: 10px 12px 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--tp-text);
  }
  .pq-count {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    color: var(--tp-text-muted);
  }
  .pq-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .pq-dot[data-status="queued"] {
    background: var(--tp-info);
  }
  .pq-dot[data-status="printing"] {
    background: var(--tp-warning);
  }
  .pq-dot[data-status="printed"] {
    background: var(--tp-success);
  }
  .pq-dot[data-status="failed"] {
    background: var(--tp-error);
  }
  .pq-list {
    list-style: none;
    margin: 0;
    padding: 4px 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    flex: 1;
  }
  .pq-none {
    padding: 14px 6px;
    text-align: center;
    color: var(--tp-text-muted);
    font-size: 12px;
  }
  .pq-card {
    position: relative;
    display: flex;
    gap: 9px;
    align-items: flex-start;
    padding: 8px;
    border: 1px solid var(--tp-divider);
    border-radius: 8px;
    background: var(--tp-paper);
    animation: pq-in 180ms ease-out;
  }
  .pq-card.pq-mine {
    cursor: grab;
  }
  .pq-card.pq-dragging {
    opacity: 0.45;
  }
  .pq-card.pq-here {
    border-color: var(--tp-accent);
    box-shadow: 0 0 0 1px var(--tp-accent);
  }
  .pq-card[data-status="printing"] {
    border-left: 3px solid var(--tp-warning);
  }
  .pq-thumb {
    width: 38px;
    height: 38px;
    border-radius: 6px;
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--tp-text-muted);
    background: color-mix(in srgb, var(--tp-text) 8%, var(--tp-paper));
  }
  .pq-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .pq-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .pq-name {
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pq-meta {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--tp-text-muted);
    min-width: 0;
  }
  .pq-meta span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pq-meta .pq-av {
    width: 16px;
    height: 16px;
    font-size: 9px;
  }
  .pq-note {
    font-size: 12px;
    color: var(--tp-text);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .pq-more {
    width: 26px;
    height: 26px;
    margin: -4px -4px 0 0;
    border-radius: 50%;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--tp-text-muted);
  }
  .pq-more:hover {
    background: color-mix(in srgb, var(--tp-text) 8%, transparent);
  }
  .pq-more svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }
  .pq-edit {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .pq-edit textarea {
    font: inherit;
    font-size: 12px;
    color: var(--tp-text);
    background: var(--tp-paper);
    border: 1px solid var(--tp-divider);
    border-radius: 6px;
    padding: 6px 8px;
    resize: vertical;
    min-height: 48px;
  }
  .pq-edit textarea:focus {
    outline: 2px solid var(--tp-accent);
    outline-offset: -1px;
  }
  .pq-edit div {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
  }
  .pq-edit button {
    padding: 3px 10px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 12px;
  }
  .pq-edit .pq-save {
    background: var(--tp-accent);
    color: var(--tp-accent-ink);
  }
  .pq-menu {
    position: absolute;
    z-index: 10;
    min-width: 190px;
    padding: 6px 0;
    border-radius: 10px;
    background: var(--tp-paper);
    box-shadow:
      0 12px 32px rgba(0, 0, 0, 0.18),
      0 2px 8px rgba(0, 0, 0, 0.1);
    animation: pq-in 150ms ease-out;
  }
  .pq-menu button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 7px 14px;
    text-align: left;
  }
  .pq-menu button:hover,
  .pq-menu button:focus-visible {
    background: color-mix(in srgb, var(--tp-text) 7%, transparent);
    outline: none;
  }
  .pq-menu .pq-danger {
    color: var(--tp-error);
  }
  .pq-menu hr {
    border: 0;
    border-top: 1px solid var(--tp-divider);
    margin: 6px 0;
  }
  .pq-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    color: var(--tp-text-muted);
  }
  .pq-empty b {
    color: var(--tp-text);
    font-size: 14px;
  }
  .pq-skeleton {
    height: 54px;
    border-radius: 8px;
    background: color-mix(in srgb, var(--tp-text) 7%, var(--tp-paper));
    animation: pq-pulse 1.2s ease-in-out infinite alternate;
  }
  @keyframes pq-in {
    from {
      opacity: 0;
      transform: translateY(4px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
  @keyframes pq-pulse {
    to {
      opacity: 0.5;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .pq-card,
    .pq-menu,
    .pq-skeleton {
      animation: none;
    }
  }
</style>
<div class="pq">
  <div class="pq-bar">
    <div class="pq-people" role="group" aria-label="Whose prints" data-t-aria="board.whose"></div>
    <span class="pq-spacer"></span>
    <button type="button" class="pq-share" id="pq-share">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"
        />
      </svg>
      <span id="pq-share-label" data-t="share.everyone">Shared with everyone</span>
    </button>
  </div>
  <div class="pq-board" id="pq-board">
    <section class="pq-col" data-status="queued">
      <h3>
        <span class="pq-dot" data-status="queued"></span><span data-t="status.queued">Queued</span
        ><span class="pq-count"></span>
      </h3>
      <ol class="pq-list"></ol>
    </section>
    <section class="pq-col" data-status="printing">
      <h3>
        <span class="pq-dot" data-status="printing"></span><span data-t="status.printing">Printing</span
        ><span class="pq-count"></span>
      </h3>
      <ol class="pq-list"></ol>
    </section>
    <section class="pq-col" data-status="printed">
      <h3>
        <span class="pq-dot" data-status="printed"></span><span data-t="status.printed">Printed</span
        ><span class="pq-count"></span>
      </h3>
      <ol class="pq-list"></ol>
    </section>
    <section class="pq-col" data-status="failed">
      <h3>
        <span class="pq-dot" data-status="failed"></span><span data-t="status.failed">Failed</span
        ><span class="pq-count"></span>
      </h3>
      <ol class="pq-list"></ol>
    </section>
  </div>
  <div class="pq-empty" id="pq-empty" hidden>
    <b data-t="board.emptyTitle">Nothing in the queue yet</b>
    <span data-t="board.emptyHint">On a model's page, pick Add to print queue.</span>
  </div>
</div>
