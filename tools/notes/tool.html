<style>
  .tpn-board {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 100%;
    padding: 16px 18px 20px;
    background: var(--tp-background);
    font-size: 14px;
  }
  .tpn-board header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .tpn-board h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }
  .tpn-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 20px;
    padding: 0 7px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--tp-text) 10%, transparent);
    color: var(--tp-text-muted);
    font-size: 12px;
    font-weight: 700;
  }
  .tpn-search {
    display: flex;
    align-items: center;
    gap: 6px;
    width: min(100%, 300px);
    height: 36px;
    padding: 0 10px;
    border: 1px solid color-mix(in srgb, var(--tp-text) 22%, transparent);
    border-radius: 8px;
    background: var(--tp-paper);
    color: var(--tp-text-muted);
    transition:
      border-color 150ms,
      box-shadow 150ms;
  }
  .tpn-search:focus-within {
    border-color: var(--tp-accent);
    box-shadow: 0 0 0 1px var(--tp-accent);
  }
  .tpn-search input {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--tp-text);
    font: inherit;
  }
  .tpn-notice {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 8px;
    background: color-mix(in srgb, var(--tp-warning) 14%, transparent);
    font-size: 13px;
  }
  .tpn-notice[hidden] {
    display: none;
  }
  .tpn-notice .tpn-btn {
    height: 28px;
  }
  .tpn-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr));
    align-items: start;
    gap: 14px;
  }
  .tpn-card {
    position: relative;
    display: grid;
    gap: 8px;
    min-width: 0;
    padding: 10px 10px 12px 12px;
    background: var(--tpn-paper);
    color: var(--tpn-ink);
    box-shadow:
      0 4px 10px rgba(0, 0, 0, 0.14),
      0 1px 2px rgba(0, 0, 0, 0.12);
    transition:
      translate 150ms ease,
      box-shadow 150ms ease;
  }
  .tpn-card:hover {
    translate: 0 -2px;
    box-shadow:
      0 8px 18px rgba(0, 0, 0, 0.18),
      0 1px 2px rgba(0, 0, 0, 0.12);
  }
  /* The folded corner. */
  .tpn-card::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: 0;
    width: 14px;
    height: 14px;
    background: linear-gradient(135deg, rgba(0, 0, 0, 0.2) 50%, var(--tp-background) 50%);
  }
  .tpn-cards.tpn-entering .tpn-card {
    animation: tpn-pop 200ms ease-out backwards;
  }
  .tpn-cards.tpn-entering .tpn-card:nth-child(2) {
    animation-delay: 30ms;
  }
  .tpn-cards.tpn-entering .tpn-card:nth-child(3) {
    animation-delay: 60ms;
  }
  .tpn-cards.tpn-entering .tpn-card:nth-child(n + 4) {
    animation-delay: 90ms;
  }
  .tpn-card-head {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .tpn-model {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    margin-right: auto;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
  }
  .tpn-model:disabled {
    cursor: default;
    opacity: 0.7;
  }
  .tpn-model:hover:not(:disabled) .tpn-model-name {
    text-decoration: underline;
  }
  .tpn-model-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tpn-thumb {
    display: grid;
    flex: none;
    place-items: center;
    width: 40px;
    height: 30px;
    overflow: hidden;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.55);
    font-weight: 700;
  }
  .tpn-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .tpn-card .tpn-icon-btn {
    color: inherit;
    opacity: 0.7;
  }
  .tpn-card .tpn-icon-btn:hover {
    background: rgba(0, 0, 0, 0.08);
    color: inherit;
    opacity: 1;
  }
  .tpn-card-text {
    margin: 0;
    font-size: 13px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .tpn-card-foot {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    opacity: 0.75;
  }
  .tpn-card-foot svg {
    width: 13px;
    height: 13px;
  }
  .tpn-skeleton {
    height: 116px;
    background: linear-gradient(
        90deg,
        var(--tp-paper) 0,
        color-mix(in srgb, var(--tp-text) 7%, var(--tp-paper)) 50%,
        var(--tp-paper) 100%
      )
      0 0 / 200% 100%;
    box-shadow: none;
    animation: tpn-shimmer 1.2s linear infinite;
  }
  .tpn-skeleton::after {
    display: none;
  }
  .tpn-state {
    display: grid;
    justify-items: center;
    gap: 10px;
    padding: 40px 16px;
    color: var(--tp-text-muted);
    text-align: center;
  }
  .tpn-state p {
    max-width: 340px;
    margin: 0;
  }
  .tpn-state-picture svg {
    width: 56px;
    height: 56px;
    rotate: -6deg;
    filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.2));
  }
  .tpn-board .tpn-btn {
    justify-self: center;
    align-self: center;
    height: 32px;
    padding: 0 14px;
    border: 1px solid var(--tp-accent);
    border-radius: 8px;
    color: var(--tp-accent);
    font-weight: 600;
    transition: background-color 150ms;
  }
  .tpn-board .tpn-btn:hover {
    background: color-mix(in srgb, var(--tp-accent) 8%, transparent);
  }
  .tpn-sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  @media (pointer: coarse) {
    .tpn-search input {
      font-size: 16px;
    }
    .tpn-board .tpn-btn {
      height: 44px;
    }
  }
</style>
<section class="tpn-board">
  <header>
    <h2><span data-t="board.title"></span><span class="tpn-count" hidden></span></h2>
    <label class="tpn-search">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
        />
      </svg>
      <input type="search" data-t-aria="board.search" data-t-placeholder="board.search" maxlength="200" />
    </label>
  </header>
  <div class="tpn-cards"></div>
  <div class="tpn-state" role="status" hidden></div>
  <button class="tpn-btn tpn-more" type="button" data-t="board.more" hidden></button>
</section>
