<style>
  .tp-printing-wiki {
    --wiki-soft: color-mix(in srgb, var(--tp-accent) 8%, var(--tp-paper));
    --wiki-good: var(--tp-success, #2e7d4f);
    --wiki-bad: var(--tp-error, #c0392b);
    height: 100%;
    overflow: auto;
    background: var(--tp-background);
    color: var(--tp-text);
    container-type: inline-size;
    font-family: var(--tp-font, system-ui, sans-serif);
    font-size: 14px;
    line-height: 1.55;
    overflow-wrap: anywhere;
  }
  .tp-printing-wiki :where(*) {
    box-sizing: border-box;
  }
  .tp-printing-wiki [hidden] {
    display: none !important;
  }
  .tp-printing-wiki :where(h1, h2, h3, p, figure, fieldset) {
    margin: 0;
  }
  .tp-printing-wiki :where(button, input) {
    font: inherit;
    color: inherit;
  }
  .tp-printing-wiki :where(button) {
    cursor: pointer;
  }
  .tp-printing-wiki :where(button:disabled) {
    cursor: default;
    opacity: 0.5;
  }
  .tp-printing-wiki :where(button, a, input):focus-visible {
    outline: 2px solid var(--tp-accent);
    outline-offset: 2px;
  }
  .tp-printing-wiki h1:focus {
    outline: none;
  }
  .tp-printing-wiki .wiki-muted {
    color: var(--tp-text-muted);
  }
  .tp-printing-wiki .wiki-top {
    background: var(--tp-paper);
    border-bottom: 1px solid var(--tp-divider);
    padding: 14px clamp(14px, 3cqi, 34px) 0;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .tp-printing-wiki .wiki-top-inner,
  .tp-printing-wiki .wiki-nav,
  .tp-printing-wiki .wiki-pane {
    width: 100%;
    max-width: 1220px;
    margin-inline: auto;
  }
  .tp-printing-wiki .wiki-top-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px 24px;
  }
  .tp-printing-wiki .wiki-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    font-weight: 750;
  }
  .tp-printing-wiki .wiki-book {
    display: inline-block;
    width: 22px;
    height: 17px;
    border: 2px solid currentColor;
    border-radius: 4px;
    color: var(--tp-accent);
    background: linear-gradient(currentColor, currentColor) center / 2px 100% no-repeat;
  }
  .tp-printing-wiki .wiki-search {
    display: flex;
    gap: 10px;
    align-items: center;
    flex: 1 1 280px;
    max-width: 410px;
    padding: 0 10px 0 13px;
    min-height: 42px;
    border: 1px solid var(--tp-divider);
    border-radius: 8px;
    background: var(--tp-background);
  }
  .tp-printing-wiki .wiki-search:focus-within {
    border-color: var(--tp-accent);
  }
  .tp-printing-wiki .wiki-search input {
    min-width: 0;
    width: 100%;
    padding: 7px 0;
    border: 0;
    background: none;
    outline: none;
  }
  .tp-printing-wiki .wiki-search input::-webkit-search-cancel-button {
    appearance: none;
  }
  .tp-printing-wiki .wiki-search button {
    border: 0;
    border-radius: 4px;
    background: transparent;
    padding: 0 5px;
    font-size: 21px;
    line-height: 1.25;
  }
  .tp-printing-wiki .wiki-magnifier {
    position: relative;
    flex: 0 0 13px;
    height: 13px;
    border: 2px solid var(--tp-text-muted);
    border-radius: 50%;
  }
  .tp-printing-wiki .wiki-magnifier::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 2px;
    right: -6px;
    bottom: -3px;
    transform: rotate(45deg);
    background: var(--tp-text-muted);
  }
  .tp-printing-wiki .wiki-sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .tp-printing-wiki .wiki-nav {
    display: flex;
    gap: 2px clamp(4px, 1cqi, 12px);
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .tp-printing-wiki .wiki-tab {
    color: var(--tp-text-muted);
    text-align: left;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 8px clamp(6px, 1cqi, 12px);
    font-weight: 650;
  }
  .tp-printing-wiki .wiki-tab:hover,
  .tp-printing-wiki .wiki-tab[aria-current="page"] {
    color: var(--tp-text);
    background: var(--wiki-soft);
  }
  .tp-printing-wiki .wiki-tab[aria-current="page"] {
    border-bottom-color: var(--tp-accent);
  }
  .tp-printing-wiki .wiki-pane {
    padding: clamp(14px, 3cqi, 34px);
  }
  .tp-printing-wiki .wiki-flow {
    display: grid;
    gap: 15px;
  }
  .tp-printing-wiki .wiki-pane > .wiki-flow {
    gap: 24px;
  }
  .tp-printing-wiki h1 {
    font-size: clamp(25px, 4cqi, 38px);
    line-height: 1.12;
    letter-spacing: -0.035em;
  }
  .tp-printing-wiki h2 {
    font-size: 19px;
    line-height: 1.25;
    letter-spacing: -0.012em;
  }
  .tp-printing-wiki .wiki-page-title {
    display: grid;
    justify-items: start;
    gap: 8px;
  }
  .tp-printing-wiki .wiki-page-title > p {
    max-width: 68ch;
  }
  .tp-printing-wiki .wiki-hero {
    display: grid;
    grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
    position: relative;
    isolation: isolate;
    color: #faf8f5;
    border-radius: 14px;
    overflow: hidden;
    background: #181c26;
  }
  .tp-printing-wiki .wiki-hero .wiki-page-title {
    z-index: 1;
    gap: 13px;
    align-content: center;
    padding: clamp(22px, 4cqi, 42px);
  }
  .tp-printing-wiki .wiki-hero h1 {
    font-size: clamp(30px, 5cqi, 54px);
    max-width: 14ch;
  }
  .tp-printing-wiki .wiki-hero .wiki-muted {
    color: #dadce6;
    font-size: 15px;
  }
  .tp-printing-wiki .wiki-hero-image {
    align-self: stretch;
    width: 100%;
    height: 100%;
    max-height: 310px;
    object-fit: cover;
    object-position: center 48%;
  }
  .tp-printing-wiki .wiki-hero .wiki-primary {
    --tp-accent: #ff885e;
    --tp-accent-ink: #241710;
  }
  .tp-printing-wiki .wiki-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 13px;
    min-height: 38px;
    border: 1px solid var(--tp-divider);
    border-radius: 7px;
    background: var(--tp-paper);
    color: var(--tp-text);
    font-weight: 650;
    text-align: left;
  }
  .tp-printing-wiki .wiki-button:hover:not(:disabled) {
    border-color: var(--tp-accent);
  }
  .tp-printing-wiki .wiki-primary {
    background: var(--tp-accent);
    border-color: var(--tp-accent);
    color: var(--tp-accent-ink);
  }
  .tp-printing-wiki .wiki-primary:hover {
    filter: brightness(0.92);
  }
  .tp-printing-wiki .wiki-hero-secondary {
    background: #242a38;
    color: #faf8f5;
    border-color: #505769;
  }
  .tp-printing-wiki .wiki-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .tp-printing-wiki .wiki-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
    gap: 12px;
  }
  .tp-printing-wiki .wiki-photos {
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 212px), 1fr));
  }
  .tp-printing-wiki .wiki-card {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 0;
    overflow: hidden;
    text-align: left;
    border: 1px solid var(--tp-divider);
    border-radius: 10px;
    background: var(--tp-paper);
  }
  .tp-printing-wiki .wiki-card:hover {
    border-color: var(--tp-accent);
    background: var(--wiki-soft);
  }
  .tp-printing-wiki .wiki-card-content {
    display: grid;
    align-content: start;
    width: 100%;
    gap: 4px;
    padding: 12px 30px 14px 14px;
  }
  .tp-printing-wiki .wiki-card-title {
    font-size: 15px;
    font-weight: 720;
    line-height: 1.3;
  }
  .tp-printing-wiki .wiki-card-photo {
    display: block;

    object-position: center 48%;

  .tp-printing-wiki .wiki-case-grid {
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));

  .tp-printing-wiki .wiki-case-grid .wiki-card {
    flex-direction: row;
    min-height: 104px;
    align-items: center;
  }
  .tp-printing-wiki .wiki-card-thumb {
    flex: 0 0 clamp(64px, 9cqi, 96px);
