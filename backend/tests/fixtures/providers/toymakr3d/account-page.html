<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Account | Toymakr3D</title>

      <div class="indicator__dropdown">
        <div class="account-menu">
          <a href="https://www.toymakr3d.com/my-account" class="account-menu__user">

            <div class="profile-card__edit mt-3"><a href="/logout" class="btn btn-secondary btn-sm">Logout</a></div>
          </div>
        </div>

    </div>
