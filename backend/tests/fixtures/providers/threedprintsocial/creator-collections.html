<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Collections | 3DPrint.social</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg"><a class="navbar-brand" href="/">3DPrint.social</a></nav>
    <main class="container-fluid">
      <nav aria-label="breadcrumb" class="border-bottom pt-1 pb-1">
        <ol class="breadcrumb">
          <li class="breadcrumb-item">
            <a href="/dashboard"><i class="bi bi-house" role="img" title="Home"></i></a>
          </li>

          <li class="breadcrumb-item active" aria-current="page">Collections</li>
        </ol>
      </nav>
      <div class="row row-cols-md-2 mt-2">
        <div class="col-md-9" id="item_list">
          <div class="skip-link-container">
            <a class="visually-hidden-focusable" href="#sidebar">Skip to sidebar</a>
            <div class="row">
              <div class="col"></div>
              <div class="col col-auto"></div>
            </div>
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 mb-4">
              <div class="col mb-4">
                <div class="card preview-card">
                  <div
                    class="card-img-top card-img-top-background"
                    style="background-image: url(/models/xc68zh951g26/model_files/q2w3e4r5t6y7.jpg?derivative=preview)"
                  ></div>
                  <img
                    class="card-img-top image-preview"
                    alt="3D Printer Mods"
                    src="/models/xc68zh951g26/model_files/q2w3e4r5t6y7.jpg?derivative=preview"
                  />
                  <div class="card-body">
                    <div class="row">
                      <div class="col">
                        <div class="card-title">
                          3D Printer Mods
                          <i class="bi bi-globe" role="img" title="Public"></i>
                        </div>
                      </div>
                      <div class="col col-auto">
                        <small
                          ><ul class="list-unstyled">
                            <li>
                              <i class="bi bi-person" role="img" title="Creator"></i>
                              <a href="/collections?creator=maker-one">Maker One</a><br />
                            </li></ul
                        ></small>
                      </div>
                    </div>
                  </div>
                  <div class="card-footer">
                    <div class="row">
                      <div class="col">
                        <a
                          class="btn btn-primary"
                          aria-label="Models in 3D Printer Mods"
                          href="/collections/krfflpzgbtvf"
                          ><span>5 models</span></a
                        >
                      </div>
                      <div class="col col-auto">
                        <div class="dropdown">
                          <ul class="dropdown-menu">
                            <li>
                              <a class="dropdown-item" href="/collections/krfflpzgbtvf/reports/new"
                                ><i class="bi bi-flag" role="img" title="Report"></i> Report</a
                              >
                            </li>
                          </ul>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col mb-4">
                <div class="card preview-card">
                  <div class="preview-empty"><p>No preview</p></div>
                  <div class="card-body">
                    <div class="row">
                      <div class="col">
                        <div class="card-title">
                          Household Items
                          <i class="bi bi-globe" role="img" title="Public"></i>
                        </div>
                      </div>
                      <div class="col col-auto">
                        <small
                          ><ul class="list-unstyled">
                            <li>
                              <i class="bi bi-person" role="img" title="Creator"></i>
                              <a href="/collections?creator=maker-one">Maker One</a><br />
                            </li></ul
                        ></small>
                      </div>
                    </div>
                  </div>
                  <div class="card-footer">
                    <div class="row">
                      <div class="col">
                        <a
                          class="btn btn-primary"
                          aria-label="Models in Household Items"
                          href="/collections/bq7x2m9k4d1s"
                          ><span>19 models</span></a
                        >
                      </div>
                      <div class="col col-auto">
                        <div class="dropdown">
                          <ul class="dropdown-menu">
                            <li>
                              <a class="dropdown-item" href="/collections/bq7x2m9k4d1s/reports/new"
                                ><i class="bi bi-flag" role="img" title="Report"></i> Report</a
                              >
                            </li>
                          </ul>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-3" id="sidebar"></div>
      </div>
    </main>
  </body>
</html>
