<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Maker One | 3DPrint.social</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg"><a class="navbar-brand" href="/">3DPrint.social</a></nav>
    <main class="container-fluid">
      <nav aria-label="breadcrumb" class="border-bottom pt-1 pb-1">
        <ol class="breadcrumb">
          <li class="breadcrumb-item">
            <a href="/dashboard"><i class="bi bi-house" role="img" title="Home"></i></a>
          </li>
          <li class="breadcrumb-item"><a href="/creators">Creators</a></li>
          <li class="breadcrumb-item active" aria-current="page">Maker One</li>
        </ol>
      </nav>
      <div class="row row-cols-md-2 mt-2">
        <div class="col-md-9" id="item_list">
          <div class="card mb-3">
            <div class="card-body row me-0 ms-0 with-background">
              <div class="col col-auto">
                <div class="text-center">
                  <h2>Maker One</h2>
                  <p>
                    <small class="text-secondary"><span>@maker-one@3dprint.social</span></small>
                  </p>
                </div>
              </div>
              <div class="col">
                <p class="lead">I make enclosures.</p>
                <p>2 models</p>
                <p>31 followers</p>
              </div>
              <div class="col col-auto"></div>
            </div>
          </div>
          <div class="skip-link-container">
            <div class="row">
              <a class="visually-hidden-focusable" href="#sidebar">Skip to sidebar</a>
              <div class="col"></div>
              <div class="col col-auto">
                <div class="dropdown"><button class="btn btn-secondary dropdown-toggle">Sort by name</button></div>
              </div>
            </div>
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 mb-4">
              <div class="col mb-3">
                <div class="card preview-card">
                  <div
                    class="card-img-top card-img-top-background"
                    style="background-image: url(/models/xc68zh951g26/model_files/ac68zh951g26.jpg?derivative=preview)"
                  ></div>
                  <img
                    class="card-img-top image-preview"
                    alt="H2 housing photo"
                    src="/models/xc68zh951g26/model_files/ac68zh951g26.jpg?derivative=preview"
                  />
                  <div class="card-body">
                    <div class="row">
                      <div class="col">
                        <div class="card-title">
                          <span>H2 housing</span> <i class="bi bi-globe" role="img" title="Public"></i>
                        </div>
                      </div>
                      <div class="col-auto">
                        <small
                          ><ul class="list-unstyled">
                            <li>
                              <i class="bi bi-person" role="img" title="Creator"></i>
                              <a aria-label="Creator: Maker One" href="/creators/maker-one">Maker One</a>
                            </li>
                          </ul></small
                        >
                      </div>
                    </div>
                  </div>
                  <div class="card-footer">
                    <div class="row">
                      <div class="col">
                        <a class="btn btn-primary btn-sm" aria-label="Open model H2 housing" href="/models/xc68zh951g26"
                          >Open</a
                        >
                        <form class="button_to" method="post" action="/lists/liked">
                          <button class="btn btn-sm btn-outline-secondary" type="submit">
                            <i class="bi bi-heart" role="img" title="Like"></i>
                          </button>
                        </form>
                      </div>
                      <div class="col col-auto">
                        <div class="dropdown">
                          <ul class="dropdown-menu">
                            <li>
                              <a class="dropdown-item" href="/models/xc68zh951g26/reports/new"
                                ><i class="bi bi-flag" role="img" title="Report"></i> Report</a
                              >
                            </li>
                          </ul>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col mb-3">
                <div class="card preview-card">
                  <div
                    class="card-img-top card-img-top-background"
                    style="background-image: url(/models/w35tk0prbf7h/model_files/a35tk0prbf7h.jpg?derivative=preview)"
                  ></div>
                  <img
                    class="card-img-top image-preview"
                    alt="Vacuum tool holder photo"
                    src="/models/w35tk0prbf7h/model_files/a35tk0prbf7h.jpg?derivative=preview"
                  />
                  <div class="card-body">
                    <div class="row">
                      <div class="col">
                        <div class="card-title">
                          <span>Vacuum tool holder</span> <i class="bi bi-globe" role="img" title="Public"></i>
                        </div>
                      </div>
                      <div class="col-auto">
                        <small
                          ><ul class="list-unstyled">
                            <li>
                              <i class="bi bi-person" role="img" title="Creator"></i>
                              <a aria-label="Creator: Maker One" href="/creators/maker-one">Maker One</a>
                            </li>
                          </ul></small
                        >
                      </div>
                    </div>
                  </div>
                  <div class="card-footer">
                    <div class="row">
                      <div class="col">
                        <a
                          class="btn btn-primary btn-sm"
                          aria-label="Open model Vacuum tool holder"
                          href="/models/w35tk0prbf7h"
                          >Open</a
                        >
                        <form class="button_to" method="post" action="/lists/liked">
                          <button class="btn btn-sm btn-outline-secondary" type="submit">
                            <i class="bi bi-heart" role="img" title="Like"></i>
                          </button>
                        </form>
                      </div>
                      <div class="col col-auto">
                        <div class="dropdown">
                          <ul class="dropdown-menu">
                            <li>
                              <a class="dropdown-item" href="/models/w35tk0prbf7h/reports/new"
                                ><i class="bi bi-flag" role="img" title="Report"></i> Report</a
                              >
                            </li>
                          </ul>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-3" id="sidebar"></div>
      </div>
    </main>
  </body>
</html>
