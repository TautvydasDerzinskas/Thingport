name: Format

# Fails when any file isn't formatted. Run `npm run format` at the repo root to fix.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # A main -> develop back-merge only brings release commits main already tested.
    if: github.head_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
      - run: npm ci
      - run: npx prettier --check .
      - name: Provider copies match providers/
        run: npm run providers:check
      - name: SDK reference matches frontend/src/sdk/types.ts, and the examples type-check
        run: npm run sdk:check
      - name: Studio's backend copies match frontend/src/studio
        run: npm run studio:check
      - name: The 3MF adapter's copies match backend/src/adapter
        run: npm run adapter:check
      - name: gofmt
        run: test -z "$(gofmt -l bridge)" || { gofmt -l bridge; exit 1; }
      - name: Workflow scripts' tests
        run: node --test '.github/scripts/*.test.mjs'
