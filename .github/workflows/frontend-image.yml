name: Frontend image

# Runs when frontend/ or the build workflow changes. Use "Manual image publish" to force a build.
# Pull requests into develop only run the checks; the image build waits for the merge, which publishes :dev for
# testers, and the develop -> main pull request builds it again before a release.
# A merge into main isn't tested again, its pull request was, and when it changes the backend too the two images go
# out together, the backend's first: this one is tagged once the backend's has been (build-image.yml's publish), so
# nobody pulls a new frontend for an old backend. The update checker reads this workflow's runs too (backend-image.yml).
# On develop, :dev is only tagged once no backend run is left going, but a failed one doesn't hold it back.
on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-image.yml"
      - ".github/workflows/build-image.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-image.yml"
      - ".github/workflows/build-image.yml"

concurrency:
  group: frontend-image-${{ github.ref }}
  # A newer push replaces an older run, but never one on main: cut off mid-release, a version could be tagged
  # without its GitHub release. Runs on main queue instead; the newest builds everything merged so far.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Typecheck, lint, tests and a production build, natively. The image build skips the Dockerfile's test
  # stage, so this is the only place the frontend tests run.
  verify:
    # Not on main, whose pull requests ran this, nor for a main -> develop back-merge, which only brings those and the
    # release commits.
    if: github.head_ref != 'main' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run verify

  # A merge into main may give the frontend a new version (release-project.yml); the image is built from it.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release-project.yml
    with:
      project_dir: frontend
      title: Thingport frontend
    secrets: inherit

  build:
    needs: [verify, release]
    # After the checks, or on main without them; also when the release was skipped, as on pull requests, never after
    # a failed one.
    if: >-
      ${{ !cancelled() && (needs.verify.result == 'success' || github.ref == 'refs/heads/main')
      && needs.release.result != 'failure'
      && !(github.event_name == 'pull_request' && github.base_ref == 'develop') }}
    permissions:
      actions: read # publish reads the backend's run
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      ref: ${{ needs.release.outputs.ref }}
      version: ${{ needs.release.outputs.version }}
      project_dir: frontend
      image_name: ghcr.io/${{ github.repository_owner }}/thingport-frontend
      context: ./frontend
      dockerfile: frontend/Dockerfile
      cache_scope: frontend
      push: ${{ github.event_name != 'pull_request' }}
      # On main, after the backend's image for the same commit; the backend's job waits for this one's "build / build":
      # don't rename either. On develop, after whatever backend run is still going.
      wait_for_workflow: ${{ github.event_name == 'push' && 'backend-image.yml' || '' }}
      wait_for_job: ${{ github.ref == 'refs/heads/main' && 'build / publish' || '' }}
    secrets: inherit
