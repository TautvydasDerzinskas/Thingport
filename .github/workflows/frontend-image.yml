name: Frontend image

# Runs when frontend/ or the build workflow changes. Use "Manual image publish" to force a build.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-image.yml"
      - ".github/workflows/build-image.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-image.yml"
      - ".github/workflows/build-image.yml"

concurrency:
  group: frontend-image-${{ github.ref }}
  # A newer push replaces a pull request's run, but never one on main: cut off mid-release, a version could be
  # tagged without its GitHub release. Runs on main queue instead; the newest builds everything merged so far.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A merge into main may give the frontend a new version (release-project.yml); the image is built from it.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release-project.yml
    with:
      project_dir: frontend
      title: Thingport frontend
    secrets: inherit

  build:
    needs: release
    # Also when the release was skipped, as on pull requests; never after a failed one.
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      ref: ${{ needs.release.outputs.ref }}
      version: ${{ needs.release.outputs.version }}
      project_dir: frontend
      image_name: ghcr.io/${{ github.repository_owner }}/thingport-frontend
      context: ./frontend
      dockerfile: frontend/Dockerfile
      cache_scope: frontend
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
