name: CodeRabbit retry

# Asks CodeRabbit for the reviews a pull request is owed: a push it didn't review, a review its rate limit refused
# once the wait is over, and a full review where a plain one had nothing to say. Every 30 minutes; a run asks for
# what's due and stops, never waiting. The rules are in .github/scripts/coderabbit-retry.mjs.
#
# CodeRabbit ignores commands from github-actions[bot], so the asks are posted by an ordinary GitHub account kept for
# it: the CODERABBIT_ASK_TOKEN secret holds that account's classic token with only the `public_repo` scope. The account
# needn't be a collaborator, and shouldn't be: that scope would then let the token push. Without the secret nothing
# is posted.
on:
  schedule:
    # Off the hour, when GitHub delays and drops the most scheduled runs.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only log what would be asked and when
        type: boolean
        default: false

permissions:
  contents: read
  checks: read
  issues: read
  pull-requests: read

# One at a time, so two runs can't ask for the same pull request.
concurrency:
  group: coderabbit-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node .github/scripts/coderabbit-retry.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ASK_TOKEN: ${{ secrets.CODERABBIT_ASK_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
