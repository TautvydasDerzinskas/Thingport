name: CodeRabbit retry

# CodeRabbit refuses a review once its allowance is used up and never comes back to it, so this asks again
# (`@coderabbitai review`) when the wait it gave has passed. It also asks for a push CodeRabbit never started on, or a
# review it never finished. A run asks for what's due and stops, so it runs often instead of waiting: every five
# minutes, and whenever a CodeRabbit check finishes, as GitHub drops many scheduled runs. See
# .github/scripts/coderabbit-retry.mjs.
#
# CodeRabbit ignores commands from github-actions[bot], so the asks are posted by an ordinary GitHub account kept for
# it: the CODERABBIT_ASK_TOKEN secret holds that account's classic token with only the `public_repo` scope. The account
# needn't be a collaborator, and shouldn't be: that scope would then let the token push. Without the secret nothing
# is posted.
on:
  check_run:
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only log what would be asked and when
        type: boolean
        default: false

permissions:
  contents: read
  checks: read
  issues: read
  pull-requests: read

# One at a time, so two runs can't ask for the same pull request; a run takes seconds, so the next just queues.
concurrency:
  group: coderabbit-retry
  cancel-in-progress: false

jobs:
  retry:
    if: github.event_name != 'check_run' || github.event.check_run.app.slug == 'coderabbitai'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node .github/scripts/coderabbit-retry.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ASK_TOKEN: ${{ secrets.CODERABBIT_ASK_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
