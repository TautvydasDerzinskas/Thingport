name: Status badges

# Writes the README's status chips: one shields.io endpoint file per workflow, its short name and a tick or a cross for
# its latest finished run on the default branch, as GitHub's own badges report it. Those can't be given a short name or
# a tick, hence this. The files live on the `badges` branch, one commit replaced each time, so nothing piles up.
# Every run writes all of them, so whichever workflow finished, and a first run after merging, leave them all current.
on:
  workflow_run:
    workflows: [Website, Frontend image, Backend image, Bridge release, Extension checks, Regression pack]
    types: [completed]
    branches: [develop]
  push:
    branches: [develop]
    paths: [".github/workflows/status-badges.yml"]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: status-badges
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Write a chip per workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p "$RUNNER_TEMP/badges"
          cd "$RUNNER_TEMP/badges"
          chip() {
            conclusion=$(gh api "repos/$REPO/actions/workflows/$1.yml/runs?branch=$BRANCH&status=completed&per_page=1" \
              --jq '.workflow_runs[0].conclusion // ""')
            case "$conclusion" in
              success) message="✓" color="brightgreen" ;;
              failure | timed_out | startup_failure) message="✗" color="red" ;;
              *) message="–" color="lightgrey" ;;
            esac
            printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s","cacheSeconds":300}\n' \
              "$2" "$message" "$color" > "$1.json"
            echo "$2: ${conclusion:-none}"
          }
          chip web-pages Website
          chip frontend-image Frontend
          chip backend-image Backend
          chip bridge-release Bridge
          chip extension-release Extension
          chip regression Regression
      - name: Replace the badges branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Status badges"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" badges
