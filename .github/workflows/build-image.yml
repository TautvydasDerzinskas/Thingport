name: Build image (reusable)

# Shared build+push logic used by backend-image.yml, frontend-image.yml, and
# manual-image.yml — not triggered on its own (workflow_call only).
on:
  workflow_call:
    inputs:
      project_dir:
        description: "The npm project directory to lint, e.g. backend or frontend"
        required: true
        type: string
      image_name:
        description: "Fully-qualified image name, e.g. ghcr.io/owner/thingport-backend"
        required: true
        type: string
      context:
        description: "Docker build context"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile"
        required: true
        type: string
      cache_scope:
        description: "GHA cache scope, so backend/frontend caches don't collide"
        required: true
        type: string
      push:
        description: "Whether to log in and push (false for PR validation builds)"
        required: false
        type: boolean
        default: true
      ref:
        description: "The commit to build; the triggering one when empty"
        required: false
        type: string
        default: ""
      version:
        description: "The release's version (release-project.yml), tagged as X.Y.Z, X.Y and X; empty for none"
        required: false
        type: string
        default: ""
      wait_for_workflow:
        description: >-
          The other image's workflow file, e.g. frontend-image.yml: the image is pushed untagged and only tagged once
          wait_for_job has succeeded in that workflow's run for the same commit, or straight away when it has none.
          Empty to tag it as it's pushed
        required: false
        type: string
        default: ""
      wait_for_job:
        description: >-
          The job in wait_for_workflow to wait for, as the API names it, e.g. build / build. Empty to wait instead
          until that workflow has no run queued or in progress on this branch, whatever its commit, and then tag
          the image even if one failed
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    # A build takes about 10 minutes; a step hung under QEMU otherwise runs until GitHub's 6-hour limit.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ inputs.project_dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ inputs.project_dir }}
        run: npm ci --no-audit --no-fund

      - name: Lint (quality gate — blocks the image build on failure)
        working-directory: ${{ inputs.project_dir }}
        run: npm run lint

      # `vite build` strips types without checking them. The backend has no typecheck script (its build
      # runs tsc), so --if-present makes this a no-op there.
      - name: Typecheck (quality gate — frontend only, see comment)
        working-directory: ${{ inputs.project_dir }}
        run: npm run --if-present typecheck

      - name: Set up QEMU (for the arm64 leg of the multi-arch build below)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image_name }}
          tags: |
            # develop's builds go out as :dev instead, the channel for testers who want changes before a release. Not a
            # manual rebuild of a release dispatched from develop, which would put the release's code under :dev.
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/develop' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' && inputs.version == '' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            # main, not "the default branch": that's develop now, and :latest is what's released.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # The owner in a registry path must be lower case; the tags above already are.
      - name: Image name
        id: image
        env:
          IMAGE: ${{ inputs.image_name }}
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Build (and push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          # arm64 covers Apple Silicon and most ARM NAS units, built via QEMU on amd64 runners (the frontend's
          # Node stages run natively; see frontend/Dockerfile).
          platforms: linux/amd64,linux/arm64
          # Waiting for the other image, this one is pushed by its digest alone, and the publish job tags it.
          push: ${{ inputs.push && inputs.wait_for_workflow == '' }}
          outputs: >-
            ${{ inputs.push && inputs.wait_for_workflow != ''
            && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.image.outputs.name)
            || '' }}
          tags: ${{ inputs.wait_for_workflow == '' && steps.meta.outputs.tags || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            RELEASE_CHANNEL=${{ github.ref == 'refs/heads/develop' && inputs.version == '' && 'dev' || 'stable' }}
          cache-from: type=gha,scope=${{ inputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}

  # Tags the image pushed above once the other image's workflow has got far enough (.github/scripts/wait-for-job.mjs).
  # Everything slow is done by then, so the two images' tags move seconds apart.
  publish:
    needs: build
    if: inputs.push && inputs.wait_for_workflow != ''
    runs-on: ubuntu-latest
    # The wait gives up after 40 minutes, time for the other image's build or a re-run of it.
    timeout-minutes: 45
    permissions:
      actions: read # the other workflow's run
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Wait for ${{ inputs.wait_for_job || 'the runs' }} in ${{ inputs.wait_for_workflow }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ inputs.wait_for_workflow }}
          JOB: ${{ inputs.wait_for_job }}
        run: node .github/scripts/wait-for-job.mjs "$WORKFLOW" "$JOB" 40

      - name: Tag the image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] || args+=(--tag "$tag")
          done <<< "$TAGS"
          if [ -z "$IMAGE" ] || [ -z "$DIGEST" ] || [ ${#args[@]} -eq 0 ]; then
            echo "::error::The build job passed on no image, digest or tags to publish."
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
