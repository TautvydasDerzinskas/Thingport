name: Build image (reusable)

# Shared build+push logic used by backend-image.yml, frontend-image.yml, and
# manual-image.yml — not triggered on its own (workflow_call only).
on:
  workflow_call:
    inputs:
      project_dir:
        description: "The npm project directory to lint, e.g. backend or frontend"
        required: true
        type: string
      image_name:
        description: "Fully-qualified image name, e.g. ghcr.io/owner/thingport-backend"
        required: true
        type: string
      context:
        description: "Docker build context"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile"
        required: true
        type: string
      cache_scope:
        description: "GHA cache scope, so backend/frontend caches don't collide"
        required: true
        type: string
      push:
        description: "Whether to log in and push (false for PR validation builds)"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ inputs.project_dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ inputs.project_dir }}
        run: npm ci --no-audit --no-fund

      - name: Lint (quality gate — blocks the image build on failure)
        working-directory: ${{ inputs.project_dir }}
        run: npm run lint

      # Second quality gate. The frontend's image build runs `vite build`, which strips types
      # with esbuild without ever checking them -- so without this, a type error ships green.
      # Backend deliberately has no typecheck script (its build stage already runs tsc, and a
      # bare tsc here would fail anyway since this job doesn't `prisma generate`), so
      # --if-present makes this a no-op there.
      - name: Typecheck (quality gate — frontend only, see comment)
        working-directory: ${{ inputs.project_dir }}
        run: npm run --if-present typecheck

      - name: Set up QEMU (for the arm64 leg of the multi-arch build below)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image_name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          # arm64 covers Apple Silicon and most ARM-based NAS units (Synology, QNAP, etc) --
          # built via QEMU emulation above since GitHub-hosted runners are amd64-only.
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}
