name: Bug report
description: Something in Thingport doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Where?
      options:
        - Thingport (web app)
        - Thingport Grab (browser extension)
        - Thingport Bridge (desktop helper)
        - Website or docs
    validations:
      required: true
  - type: input
    id: backend_version
    attributes:
      label: Backend version
      description: >-
        Shown in Administration > Update Checker as "Running backend 1.2.0 · frontend 1.1.0". Not an admin? Ask
        yours. No version shown means a build from before versioning: give the image tag instead.
      placeholder: "e.g. 1.2.0"
  - type: input
    id: frontend_version
    attributes:
      label: Frontend version
      description: On the same line in Administration > Update Checker; the backend and frontend are versioned apart.
      placeholder: "e.g. 1.1.0"
  - type: input
    id: grab_version
    attributes:
      label: Thingport Grab version
      description: If Grab is involved. It's at the bottom of Grab's popup.
      placeholder: "e.g. v1.5.0"
  - type: input
    id: image_tags
    attributes:
      label: Docker image tags
      description: The tags you run, from your docker-compose file or `docker compose images`.
      placeholder: "e.g. :latest, :1.2.0 or :sha-abc1234"
  - type: textarea
    id: details
    attributes:
      label: Browser, OS, model link, logs
      description: >-
        Include the model URL if an import failed. For Thingport Bridge, say your OS and roughly when you downloaded
        it. Remove secrets and hostnames before pasting config or logs.
