<style>
  /* In its dark themes Thingport sets every element on the page square with !important. A moon and clouds aren't
     interface, so their radii are !important too; .wx itself is left alone, as its corners are the panel's. */
  .wx {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: inherit;
    isolation: isolate;
    --u: 2px;
    color: #fff;
    user-select: none;
    touch-action: manipulation;
  }
  .wx-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .wx-sky {
    transition: opacity 300ms;
  }

  .wx-stars {
    transition: opacity 600ms;
  }
  .wx-star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50% !important;
    background: #fff;
    animation: wx-twinkle 3s ease-in-out infinite alternate;
  }

  .wx-body {
    position: absolute;
    width: calc(var(--u) * 16);
    height: calc(var(--u) * 16);
    transform: translate(-50%, -50%);
    transition: opacity 600ms;
    pointer-events: none;
  }
  .wx-sun {
    position: absolute;
    inset: 0;
    border-radius: 50% !important;
    background: radial-gradient(circle at 40% 40%, #fff8c8, #ffd54f 60%, #ffb020);
    box-shadow: 0 0 calc(var(--u) * 6) calc(var(--u) * 2) rgba(255, 210, 80, 0.55);
  }
  .wx-rays {
    position: absolute;
    inset: -70%;
    border-radius: 50% !important;
    background: repeating-conic-gradient(rgba(255, 232, 150, 0.4) 0 7deg, transparent 7deg 22deg);
    -webkit-mask: radial-gradient(circle, #000 25%, transparent 68%);
    mask: radial-gradient(circle, #000 25%, transparent 68%);
    animation: wx-spin 60s linear infinite;
  }
  .wx-body.low .wx-sun {
    background: radial-gradient(circle at 40% 40%, #ffe3b8, #ff9a4d 60%, #ef5f3a);
    box-shadow: 0 0 calc(var(--u) * 8) calc(var(--u) * 3) rgba(255, 130, 70, 0.5);
  }
  .wx-body.low .wx-rays {
    background: repeating-conic-gradient(rgba(255, 170, 110, 0.35) 0 7deg, transparent 7deg 22deg);
  }
  .wx-moonbase {
    position: absolute;
    inset: 0;
    border-radius: 50% !important;
    background: rgba(255, 255, 255, 0.07);
  }
  .wx-moonglow {
    position: absolute;
    inset: 0;
    filter: drop-shadow(0 0 calc(var(--u) * 3) rgba(215, 225, 255, 0.6));
  }
  .wx-moon {
    position: absolute;
    inset: 0;
    border-radius: 50% !important;
    background: radial-gradient(circle at 35% 35%, #fdfbf0, #d6d9e0 70%);
  }

  .wx-blanket {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 55%;
    background: linear-gradient(var(--cc), transparent);
    opacity: 0.8;
  }
  .wx-track {
    position: absolute;
    left: 0;
    width: 100%;
    height: 0;
    animation: wx-drift linear infinite;
  }
  .wx-cloud {
    position: absolute;
    right: 100%;
    top: 0;
    width: var(--w);
    height: calc(var(--w) * 0.34);
    border-radius: 999px !important;
    background: var(--cc);
  }
  .wx-cloud::before,
  .wx-cloud::after {
    content: "";
    position: absolute;
    border-radius: 50% !important;
    background: inherit;
  }
  .wx-cloud::before {
    left: 14%;
    bottom: 30%;
    width: 52%;
    height: 150%;
  }
  .wx-cloud::after {
    left: 50%;
    bottom: 35%;
    width: 36%;
    height: 115%;
  }

  .wx-ground,
  .wx-front,
  .wx-sprite {
    filter: brightness(var(--gb, 1)) saturate(var(--gs, 1));
    transition: filter 600ms;
  }
  .wx-art {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }
  .wx-mist {
    position: absolute;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(255, 255, 255, 0.22));
  }
  .wx-standing {
    position: absolute;
    overflow: visible;
    transform-origin: 50% 100%;
    animation: wx-sway 5s ease-in-out infinite alternate;
  }
  .wx-lights {
    transition: opacity 600ms;
  }
  .wx-flicker {
    animation: wx-flicker 11s steps(1) infinite;
  }
  .wx-beacon {
    animation: wx-glow 2.4s ease-in-out infinite;
  }
  .wx-lamp {
    position: absolute;
    width: calc(var(--u) * 16);
    height: calc(var(--u) * 16);
    transform: translate(-50%, 50%);
    background: radial-gradient(circle, rgba(255, 224, 150, 0.85), rgba(255, 214, 130, 0.2) 22%, transparent 68%);
  }
  .wx-hill {
    position: absolute;
    border-radius: 50% !important;
  }
  .wx-hill.far {
    left: -25%;
    width: 95%;
    height: 42%;
    bottom: -22%;
    background: var(--g1);
  }
  .wx-hill.near {
    right: -30%;
    width: 110%;
    height: 40%;
    bottom: -24%;
    background: var(--g2);
  }
  .wx-flower {
    position: absolute;
    width: calc(var(--u) * 1.6);
    height: calc(var(--u) * 1.6);
    border-radius: 50% !important;
  }
  .wx-tree {
    position: absolute;
    right: 16%;
    bottom: 9%;
    width: calc(var(--u) * 14);
    height: calc(var(--u) * 22);
    transform-origin: 50% 100%;
    animation: wx-sway 5s ease-in-out infinite alternate;
  }
  .wx-trunk,
  .wx-branch {
    position: absolute;
    background: #5b3b25;
    border-radius: 2px !important;
  }
  .wx-trunk {
    left: 45%;
    bottom: 0;
    width: 10%;
    height: 45%;
  }
  .wx-crown {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 70%;
    border-radius: 50% 50% 45% 45% !important;
    background: var(--crown);
  }
  .wx-crown::before,
  .wx-crown::after {
    content: "";
    position: absolute;
    top: 30%;
    width: 55%;
    height: 55%;
    border-radius: 50% !important;
    background: inherit;
  }
  .wx-crown::before {
    left: -14%;
  }
  .wx-crown::after {
    right: -14%;
  }
  .wx-crown.blossom {
    background:
      radial-gradient(circle, #f7b7cc 22%, transparent 26%) 0 0 / calc(var(--u) * 3.4) calc(var(--u) * 3.4),
      var(--crown);
  }
  .wx-crown.snowy {
    box-shadow: inset 0 calc(var(--u) * 2.4) 0 rgba(255, 255, 255, 0.85);
  }
  .wx-tree.bare .wx-trunk {
    height: 85%;
  }
  .wx-branch {
    left: 47%;
    width: 6%;
    height: 36%;
    transform-origin: 50% 100%;
  }
  .wx-branch.b1 {
    bottom: 40%;
    transform: rotate(-38deg);
  }
  .wx-branch.b2 {
    bottom: 52%;
    transform: rotate(34deg);
  }
  .wx-branch.b3 {
    bottom: 65%;
    height: 24%;
    transform: rotate(-22deg);
  }

  .wx-precip {
    inset: -12%;
    transform: rotate(var(--tilt, 0deg));
  }
  .wx-fall {
    position: absolute;
    top: 0;
    height: 100%;
    animation: wx-fall linear infinite;
  }
  .wx-fall > b {
    position: absolute;
    top: 0;
    left: 0;
    display: block;
  }
  .wx-drop > b {
    width: 1.5px;
    height: calc(var(--u) * 7);
    border-radius: 1px !important;
    background: linear-gradient(transparent, rgba(215, 232, 255, 0.85));
  }
  .wx-flake > b {
    width: var(--s);
    height: var(--s);
    border-radius: 50% !important;
    background: #fff;
    box-shadow: 0 0 3px rgba(255, 255, 255, 0.8);
    animation: wx-sway-x 3s ease-in-out infinite alternate;
  }
  .wx-leaf > b {
    width: var(--s);
    height: var(--s);
    border-radius: 0 100% 0 100% !important;
    background: var(--c);
    animation: wx-tumble 4s ease-in-out infinite;
  }
  .wx-fly {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50% !important;
    background: #eaff8f;
    box-shadow: 0 0 6px 2px rgba(220, 255, 120, 0.7);
    animation:
      wx-glow 2.6s ease-in-out infinite,
      wx-wander 7s ease-in-out infinite alternate;
  }

  /* Whatever passes through: wx-track carries it across once, and the sprites inside move their own limbs. */
  .wx-cross {
    animation-iteration-count: 1;
    animation-fill-mode: both;
  }
  .wx-cross.back {
    animation-direction: reverse;
  }
  .wx-troupe {
    position: absolute;
    right: 100%;
    bottom: 0;
    height: 0;
  }
  .wx-cross.back .wx-troupe {
    transform: scaleX(-1);
  }
  .wx-sprite {
    position: absolute;
    bottom: 0;
    overflow: visible;
  }
  .wx-sprite .leg,
  .wx-sprite .arm {
    transform-box: fill-box;
    transform-origin: 50% 0;
    animation: wx-stride var(--pace, 0.4s) ease-in-out var(--delay, 0s) infinite alternate;
  }
  .wx-sprite .b {
    animation-direction: alternate-reverse;
  }
  .wx-sprite .lope {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: wx-lope var(--pace, 0.4s) ease-in-out var(--delay, 0s) infinite alternate;
  }
  .wx-sprite .wag {
    transform-box: fill-box;
    transform-origin: 100% 100%;
    animation: wx-wag 0.22s ease-in-out infinite alternate;
  }
  .wx-ball {
    position: absolute;
    bottom: 0;
    width: calc(var(--u) * 3);
    height: calc(var(--u) * 3);
    animation: wx-bounce var(--pace, 0.34s) cubic-bezier(0.2, 0.6, 0.4, 1) infinite alternate;
  }
  .wx-ball .spin {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: wx-spin 0.5s linear infinite;
  }
  .wx-beam {
    position: absolute;
    bottom: calc(var(--u) * 0.6);
    width: calc(var(--u) * 26);
    height: calc(var(--u) * 7);
    background: linear-gradient(90deg, rgba(255, 244, 200, 0.75), transparent);
    clip-path: polygon(0 62%, 100% 0, 100% 100%, 0 82%);
  }
  .wx-flock {
    position: absolute;
    bottom: 0;
    animation: wx-glide 3.4s ease-in-out infinite alternate;
  }
  .wx-bird {
    position: absolute;
    display: block;
    overflow: visible;
  }
  .wx-bird.owl {
    animation: wx-flap var(--pace, 0.6s) ease-in-out infinite alternate;
  }
  .wx-bird .wing {
    transform-origin: 10px 5px;
    animation: wx-wing var(--pace, 0.34s) ease-in-out infinite alternate;
    animation-delay: inherit;
  }
  .wx-bird .wing.right {
    --beat: -1;
  }
  .wx-meteor {
    position: absolute;
    width: calc(var(--u) * 22);
    height: 1.5px;
    transform-origin: 0 50%;
    background: linear-gradient(90deg, transparent, #fff);
    animation: wx-meteor 1.1s ease-out both;
  }

  /* The guest who comes when the scene is double-clicked: visit() in widget.js moves it and sets these states. */
  .wx-visitor {
    position: absolute;
    left: 0;
    width: 100%;
    height: 0;
  }
  .wx-visitor.back .wx-sprite {
    transform: scaleX(-1);
  }
  .wx-sprite.wx-figure {
    left: 50%;
    filter: brightness(var(--mb, 1));
  }
  .wx-sprite.wx-figure .arm {
    transform-box: view-box;
    transform-origin: var(--shoulder) 46px;
  }
  .wx-sprite.still .leg,
  .wx-sprite.still .arm,
  .wx-sprite.still .lope {
    animation: none;
  }
  .wx-figure .gaze {
    transform: translateX(4px);
    transition: transform 250ms;
  }
  .wx-figure.still .gaze {
    transform: none;
  }
  /* The eyes and sunglasses hide most of the logo, so they get out of its way now and then. A long blink comes every
     2.8 s, as long as it stands facing the viewer, so there's always one to see. */
  .wx-figure .eyes {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: wx-blink 5.6s ease-in-out var(--blink, 0s) infinite;
  }
  .wx-figure .shades {
    animation: wx-slip 5.6s ease-in-out var(--blink, 0s) infinite;
  }
  .wx-figure .smile {
    opacity: 0;
    transition: opacity 200ms;
  }
  .wx-figure.still .smile {
    opacity: 1;
  }
  .wx-figure .wave {
    display: none;
    transform-origin: 22px 46px;
    animation: wx-wave 0.28s ease-in-out infinite alternate;
  }
  .wx-figure.waving .wave {
    display: inline;
  }
  .wx-figure.waving .arm.left {
    display: none;
  }

  .wx-fogband {
    position: absolute;
    left: -50%;
    width: 200%;
    height: 34%;
    background: radial-gradient(ellipse at center, rgba(228, 233, 238, 0.6), transparent 70%);
    animation: wx-fog 26s ease-in-out infinite alternate;
  }
  .wx-flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    animation: wx-flash 8s infinite;
  }
  .wx-bolt {
    position: absolute;
    left: 30%;
    top: 16%;
    width: calc(var(--u) * 9);
    opacity: 0;
    filter: drop-shadow(0 0 6px #fff);
    animation: wx-bolt 8s infinite;
  }

  .wx-info {
    position: absolute;
    left: calc(var(--u) * 4 + 8px);
    top: calc(var(--u) * 3 + 6px);
    line-height: 1.15;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    animation: wx-in 250ms ease-out;
  }
  .wx-temp {
    font-size: clamp(22px, calc(var(--u) * 15), 56px);
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .wx-desc {
    font-size: 13px;
    font-weight: 500;
  }
  .wx-place {
    font-size: 12px;
    opacity: 0.85;
    margin-top: 2px;
  }
  .wx-extra {
    position: absolute;
    right: 12px;
    top: 10px;
    text-align: right;
    font-size: 12px;
    line-height: 1.4;
    opacity: 0.9;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  }
  .wx.small .wx-place,
  .wx.small .wx-extra {
    display: none;
  }

  @keyframes wx-twinkle {
    from {
      opacity: 0.15;
    }
    to {
      opacity: 1;
    }
  }
  @keyframes wx-spin {
    to {
      transform: rotate(360deg);
    }
  }
  @keyframes wx-drift {
    from {
      transform: translateX(0);
    }
    to {
      transform: translateX(calc(100% + var(--w)));
    }
  }
  @keyframes wx-sway {
    from {
      transform: rotate(calc(var(--sw, 1deg) * -1));
    }
    to {
      transform: rotate(var(--sw, 1deg));
    }
  }
  @keyframes wx-fall {
    from {
      transform: translateY(-15%);
    }
    to {
      transform: translateY(100%);
    }
  }
  @keyframes wx-sway-x {
    from {
      transform: translateX(calc(var(--u) * -3));
    }
    to {
      transform: translateX(calc(var(--u) * 3));
    }
  }
  @keyframes wx-tumble {
    0% {
      transform: translateX(0) rotate(0deg);
    }
    50% {
      transform: translateX(calc(var(--u) * 8)) rotate(200deg);
    }
    100% {
      transform: translateX(0) rotate(360deg);
    }
  }
  @keyframes wx-glow {
    0%,
    100% {
      opacity: 0.1;
    }
    50% {
      opacity: 1;
    }
  }
  @keyframes wx-wander {
    from {
      transform: translate(0, 0);
    }
    to {
      transform: translate(calc(var(--u) * 6), calc(var(--u) * -5));
    }
  }
  @keyframes wx-fog {
    from {
      transform: translateX(-12%);
    }
    to {
      transform: translateX(12%);
    }
  }
  @keyframes wx-flash {
    0%,
    89%,
    100% {
      opacity: 0;
    }
    90% {
      opacity: 0.65;
    }
    91% {
      opacity: 0.1;
    }
    92.5% {
      opacity: 0.5;
    }
    95% {
      opacity: 0;
    }
  }
  @keyframes wx-bolt {
    0%,
    89%,
    95%,
    100% {
      opacity: 0;
    }
    90%,
    93% {
      opacity: 1;
    }
  }
  @keyframes wx-flicker {
    0%,
    100% {
      opacity: 1;
    }
    38%,
    71% {
      opacity: 0;
    }
    52% {
      opacity: 1;
    }
  }
  @keyframes wx-stride {
    from {
      transform: rotate(var(--reach, 30deg));
    }
    to {
      transform: rotate(calc(var(--reach, 30deg) * -1));
    }
  }
  @keyframes wx-lope {
    from {
      transform: translateY(0) rotate(var(--pitch, 0deg));
    }
    to {
      transform: translateY(var(--lift, -1.5px)) rotate(calc(var(--pitch, 0deg) * -1));
    }
  }
  @keyframes wx-wag {
    from {
      transform: rotate(-14deg);
    }
    to {
      transform: rotate(18deg);
    }
  }
  @keyframes wx-bounce {
    from {
      transform: translateY(calc(var(--u) * -7));
    }
    to {
      transform: translateY(0);
    }
  }
  @keyframes wx-glide {
    from {
      transform: translateY(calc(var(--u) * -1.5));
    }
    to {
      transform: translateY(calc(var(--u) * 1.5));
    }
  }
  @keyframes wx-flap {
    from {
      transform: scaleY(1);
    }
    to {
      transform: scaleY(0.45);
    }
  }
  @keyframes wx-wing {
    from {
      transform: rotate(calc(var(--beat, 1) * 16deg));
    }
    to {
      transform: rotate(calc(var(--beat, 1) * -30deg));
    }
  }
  @keyframes wx-meteor {
    0% {
      opacity: 0;
      transform: rotate(var(--a)) translateX(0);
    }
    25% {
      opacity: 1;
    }
    100% {
      opacity: 0;
      transform: rotate(var(--a)) translateX(calc(var(--u) * 46));
    }
  }
  @keyframes wx-blink {
    0%,
    10%,
    22%,
    44%,
    47%,
    60%,
    72%,
    100% {
      transform: scaleY(1);
    }
    12%,
    20%,
    45.5%,
    62%,
    70% {
      transform: scaleY(0.06);
    }
  }
  @keyframes wx-slip {
    0%,
    9%,
    24%,
    59%,
    74%,
    100% {
      transform: translateY(0);
    }
    13%,
    20%,
    63%,
    70% {
      transform: translateY(27px);
    }
  }
  @keyframes wx-wave {
    from {
      transform: rotate(-18deg);
    }
    to {
      transform: rotate(16deg);
    }
  }
  @keyframes wx-in {
    from {
      opacity: 0;
      transform: translateY(4px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }

  /* Paused rather than removed, so drops and clouds stay spread out where their offsets put them. */
  @media (prefers-reduced-motion: reduce) {
    .wx *,
    .wx *::before,
    .wx *::after {
      animation-play-state: paused !important;
    }
    .wx-flash,
    .wx-bolt {
      display: none;
    }
    /* Paused, it would stay on its first frame, which is invisible. */
    .wx-info {
      animation: none;
    }
  }
</style>
<div class="wx">
  <div class="wx-layer wx-sky"></div>
  <div class="wx-layer wx-stars"></div>
  <div class="wx-body"></div>
  <div class="wx-layer wx-clouds"></div>
  <div class="wx-layer wx-ground"></div>
  <div class="wx-layer wx-lights"></div>
  <div class="wx-layer wx-events"></div>
  <div class="wx-layer wx-guest"></div>
  <div class="wx-layer wx-front"></div>
  <div class="wx-layer wx-halos"></div>
  <div class="wx-layer wx-shade"></div>
  <div class="wx-layer wx-precip"></div>
  <div class="wx-layer wx-fog"></div>
  <div class="wx-layer wx-storm"></div>
  <div class="wx-info">
    <div class="wx-temp">–</div>
    <div class="wx-desc">Loading…</div>
    <div class="wx-place"></div>
  </div>
  <div class="wx-extra"></div>
</div>
